org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

## Environment Properties

# The Minecraft version. Forge's 26.3 builds are the 66.x line.
minecraft_version=26.3
# Minecraft versions this mod declares compatibility with (26.3 up to, but not including, 26.4).
minecraft_version_range=[26.3,26.4)
# The Forge version. See https://files.minecraftforge.net/ for the 26.3 builds.
forge_version=66.0.4
# Forge versions this mod declares compatibility with.
forge_version_range=[66,)
# The loader (FML) version range; follows the Forge major version.
loader_version_range=[66,)
# EventBus 7 annotation processor shipped alongside Forge 66 (validates @SubscribeEvent usage at compile time).
eventbus_version=7.0.6

## Mod Properties

mod_id=magnet
mod_name=Magnet
mod_license=MIT
mod_version=1.0.0
mod_authors=onetruespec
mod_description=A toggleable magnet that pulls dropped items and experience orbs towards you from up to 10 blocks away (configurable).
