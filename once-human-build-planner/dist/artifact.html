<title>Once Human Build Planner</title>
<meta name="description" content="Once Human build planner and damage calculator: weapons from 1 to 6 stars, calibration, armor sets, mods with substats, food and drink buffs, deviants and Cradle nodes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Once Human Build Planner
   Layout: a fixed-width results rail on the right (sticky), build editor in the left column;
   on narrow screens the results collapse into a bottom sheet toggled by a button.
   Palette: cold steel greys with Once Human's rusted teal/amber accent pair. */
:root {
  --bg: #15181c;
  --bg-elev: #1c2026;
  --bg-sunk: #0f1114;
  --line: #2b313a;
  --line-strong: #3b434f;
  --fg: #e7e9ec;
  --fg-dim: #a3abb6;
  --fg-faint: #6c7581;
  --accent: #35c2b2;        /* Rosetta teal */
  --accent-ink: #0b2724;
  --accent-2: #e0a53a;      /* stardust amber */
  --crit: #ffb64c;
  --weak: #ff6b5c;
  --status: #8fd3ff;
  --good: #5fd38a;
  --warn: #e0a53a;
  --bad: #ff6b5c;
  --star: #ffcc4d;
  --legendary: #e0a53a;
  --epic: #b67cff;
  --rare: #58a6ff;
  --font-display: "Rajdhani", "Bahnschrift", "DIN Alternate", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  --gutter: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f3; --bg-elev: #ffffff; --bg-sunk: #e3e6ea; --line: #d2d7de; --line-strong: #b7bec8;
    --fg: #15181c; --fg-dim: #4b545f; --fg-faint: #7a8390;
    --accent: #0f8f82; --accent-ink: #ffffff; --accent-2: #a8731a;
    --crit: #b8730d; --weak: #c6382b; --status: #1d6fa5; --good: #1f8a4c; --warn: #a8731a; --bad: #c6382b;
    --star: #c99a12; --legendary: #a8731a; --epic: #7b3fd1; --rare: #1f6fd0;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f3; --bg-elev: #ffffff; --bg-sunk: #e3e6ea; --line: #d2d7de; --line-strong: #b7bec8;
  --fg: #15181c; --fg-dim: #4b545f; --fg-faint: #7a8390;
  --accent: #0f8f82; --accent-ink: #ffffff; --accent-2: #a8731a;
  --crit: #b8730d; --weak: #c6382b; --status: #1d6fa5; --good: #1f8a4c; --warn: #a8731a; --bad: #c6382b;
  --star: #c99a12; --legendary: #a8731a; --epic: #7b3fd1; --rare: #1f6fd0;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  padding-inline: var(--gutter);
  padding-block: 0 48px;
  min-height: 100%;
}
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
h2 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-dim); }
h3 { font-size: 16px; font-weight: 600; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.dim { color: var(--fg-dim); }
.faint { color: var(--fg-faint); }
.small { font-size: 12px; }
.hidden-visually { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Header */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  margin-inline: calc(-1 * var(--gutter)); padding: 10px var(--gutter);
  background: var(--bg-sunk); border-bottom: 1px solid var(--line);
}
.topbar .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.topbar .brand .tag { font-family: var(--font-mono); font-size: 11px; color: var(--accent); border: 1px solid var(--accent); padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.topbar .actions { display: flex; flex-wrap: wrap; gap: 6px; }

.btn {
  background: var(--bg-elev); border: 1px solid var(--line-strong); color: var(--fg);
  padding: 6px 10px; border-radius: var(--radius); font-size: 13px; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 3px 7px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Page grid */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px;
  align-items: start; margin-top: 18px;
}
.editor { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
.results { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); max-height: calc(100vh - env(safe-area-inset-top, 0px) - 70px); overflow-y: auto; padding-right: 2px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
@media (max-width: 1040px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .results { position: static; max-height: none; overflow: visible; }
}
@media (max-width: 700px) {
  .topbar { position: static; gap: 6px 12px; padding-block: 8px; }
  .topbar .actions .btn { padding: 4px 8px; font-size: 12px; }
  h1 { font-size: 20px; }
}

/* Panels */
.panel { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel > header h2 { flex: 1; }
.panel > .body { padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.panel.collapsed > .body { display: none; }
.panel > header .toggle { background: none; border: 0; color: var(--fg-faint); padding: 0 4px; font-size: 14px; }

/* Form controls */
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-faint); font-weight: 600; }
select, input[type="number"], input[type="text"], input[type="search"] {
  background: var(--bg-sunk); border: 1px solid var(--line-strong); border-radius: var(--radius);
  padding: 6px 8px; min-width: 0; width: 100%; max-width: 100%;
}
select { text-overflow: ellipsis; }
.field, .row, .substat, .effects, .bucket { min-width: 0; max-width: 100%; }
.effects .eff > span:first-child { min-width: 0; overflow-wrap: anywhere; }
input[type="number"] { font-family: var(--font-mono); }
select:disabled, input:disabled { opacity: 0.5; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > .field { flex: 1 1 160px; }
.row > .field.narrow { flex: 0 1 110px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }

/* Star picker */
.stars { display: inline-flex; gap: 2px; }
.stars button { background: none; border: 0; padding: 0 1px; font-size: 20px; line-height: 1; color: var(--line-strong); }
.stars button.on { color: var(--star); }
.stars button:hover { transform: scale(1.1); }

/* Switch */
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 32px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; margin: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: left 120ms; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 16px; background: var(--accent-ink); }

/* Chips & badges */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line-strong); background: var(--bg-sunk); }
.chip.on { border-color: var(--accent); color: var(--accent); }
.rarity-legendary { color: var(--legendary); }
.rarity-epic { color: var(--epic); }
.rarity-rare { color: var(--rare); }

/* Slot cards (armor, mods) */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.slot { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; background: var(--bg-sunk); min-width: 0; align-content: start; }
.slots { align-items: start; }
.slot > .slot-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slot .slot-name { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; color: var(--fg-dim); }
.effects { display: grid; gap: 4px; font-size: 12.5px; }
.effects .eff { display: flex; justify-content: space-between; gap: 8px; }
.effects .eff .v { font-family: var(--font-mono); white-space: nowrap; }
.eff.conditional label { cursor: pointer; }
.substats { display: grid; gap: 6px; }
.substat { display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 6px; align-items: center; }
.substat input { padding: 4px 6px; }

/* Results */
.kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--bg-sunk); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-faint); }
.kpi .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--fg-dim); font-family: var(--font-mono); }
.kpi.crit .v { color: var(--crit); }
.kpi.weak .v { color: var(--weak); }
.kpi.status .v { color: var(--status); }

table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.cmp th, table.cmp td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp th { color: var(--fg-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
table.cmp td.num { font-family: var(--font-mono); }
table.cmp tr.total td { font-weight: 700; border-top: 1px solid var(--line-strong); }
table.cmp td.delta-up { color: var(--good); }
table.cmp td.delta-down { color: var(--bad); }
.table-wrap { overflow-x: auto; }

.bucket { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 12.5px; }
.bucket .src { color: var(--fg-dim); padding-left: 10px; font-size: 12px; }
.bucket .v { font-family: var(--font-mono); text-align: right; }
.bucket .sum { font-weight: 700; border-top: 1px solid var(--line); padding-top: 4px; }
details.breakdown summary { cursor: pointer; color: var(--fg-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }

.formula { font-family: var(--font-mono); font-size: 12px; background: var(--bg-sunk); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; overflow-x: auto; white-space: pre; color: var(--fg-dim); scrollbar-width: thin; }
.formula::after { content: ''; }
@media (max-width: 700px) { .formula { white-space: pre-wrap; overflow-wrap: anywhere; } }
.note { font-size: 12px; color: var(--fg-dim); }
.note.warn { color: var(--warn); }
.confidence { font-size: 11px; font-family: var(--font-mono); }
.confidence.high { color: var(--good); }
.confidence.medium { color: var(--warn); }
.confidence.low { color: var(--bad); }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 200ms; z-index: 50; }
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>

andom snippet).","entries":[]},{"system":"scenarioPersistence2026","summary":"What carries across scenarios (relevant to whether Cradle/Memetic choices persist). Per the 2026-08-12 endgame guide quoting official notes: survives = Starchrom, Mitsuko's Marks, Sproutlets, blueprints and their star levels, cosmetics, furniture formulas, house designs, friends list, Battle Pass progress; dies = character level, tech tree, map discovery, territory. Since Cradle nodes and Memetic picks are level-driven they reset with the character each scenario (Way of Winter model).","entries":[{"key":"blueprintActivation","value":"Since v2.3.5 (2026-03-25) blueprints are activated directly with Starchrom; Blueprint Shop and Stellar Stairway retired; monthly Starchrom cap shown on Blueprint screen"},{"key":"importedGear","value":"Gear brought from Eternaland is flagged 'lost gear' (cannot be repaired/reverse engineered/traded) since 2026"}]}]},"deviants":{"_meta":{"facet":"Once Human combat deviations (deviants): skills, buffs, debuffs, scaling","gameVersion":"Mixed: game-client datamine (combat profiles) from a decompile dated <= March 2026 (post Dec-18-2025 'Combat Deviations Major Upgrade'); official Steam patch notes Jul-Dec 2025 (Versions 2.0-2.2.3); community model OHMM at Version 2.3.8 (May 2026); roster/traits from ohwikiguide snapshot Sep 2026 and OHDB 2026; Version 3.0.7 (Sep 28 2026) changes known only from search summaries.","generatedAt":"2026-10-03"},"scalingRules":{"skillRating":{"aka":["Deviant Power rating","Skill (Deviant Power)","异能评级","deviation_degree in game data"],"range":[1,5],"description":"Each secured deviation has a Skill Rating 1-5 (shown as 'Deviant Power (Skill)') and an Activity Rating 1-5 (Mood). Game-client combat formulas are linear in deviation_degree: value = base + step*degree, and in every captured case base = 3*step, so value(SR) = step*(3+SR) and the SR5 value is exactly 2x the SR1 value. Interpretation of degree as SR 1..5 is supported by two independent published endpoints (Pyro Dino 19.6% -> 39.2%). If the client indexes degree 0..4 the SR1 values would be 20% lower (e.g. Butterfly 18.9%).","confidence":"medium-high for the formulas, medium for the 1..5 indexing"},"activityRating":{"aka":["Mood","Activity"],"range":[1,5],"description":"Mood/Activity governs how long the deviation stays active (it drains in use and recovers at rest); no captured formula ties Mood to damage. OHMM lists 'scaling from activity rating and level not yet modeled'.","confidence":"medium"},"deviationPower":{"description":"Deviant Power (also 'Deviation Power' / 'Energy') is the resource consumed by Battle Skills and the Ultimate after the Dec-18-2025 overhaul: the Ultimate can be activated when Deviation Power reaches max and consumes energy based on its effect; Battle Skills enter cooldown after use; switching the deployed deviation clears Deviation Power and resets the Battle Skill cooldown. Typical max pool quoted by guides: 30-100 (unverified). Modifiers: traits Covert Energy +10/20/25/30/35% max, Growing Pains +30/40/50% max, Stable Energy +30% max, Worn-Out -5/-10% max, Power Rewind +5/10% recovery, 'Infrasonic Illusion' variants +10-20% recovery, Upper Hand (legendary: at 0 Power consume all Mood to refill Power); cradle Energy Surge (night: +1 Power / 8 s; alt. airborne +6 Power / s); Dark Resonance set: Battle Skill consumes 30 Deviant Power and has -50% cooldown, +0.6% Gun & Status DMG per 1 Energy consumed up to +30%, +12% Weapon & Status DMG while Power not full, ultimate grants 10% shield for 10 s; TEC9 Additional Rules: reloading an empty magazine restores 25% magazine capacity as Deviant Power (max 20 points); Pivot Step Leather Boots: resets Battle Skill cooldown after using the Deviation Ultimate; Voodoo Doll - Starfall Inversion trait: +1 Power / 8 s (1.5 airborne).","confidence":"medium"},"damageScaling":{"description":"Deviation attack/skill damage is Psi-Intensity-scaled Status/Elemental DMG (official Aug-28-2 <script>
/* Generic UI helpers for the Once Human Build Planner (no game logic here). */
(function (global) {
  'use strict';

  /** Create an element: h('div.cls#id', {attr: v, onclick: fn}, child, child...) */
  function h(spec, props, ...children) {
    const [tagPart, ...rest] = spec.split(/(?=[.#])/);
    const el = document.createElement(tagPart || 'div');
    for (const token of rest) {
      if (token[0] === '.') el.classList.add(token.slice(1));
      else if (token[0] === '#') el.id = token.slice(1);
    }
    if (props && typeof props === 'object' && !(props instanceof Node) && !Array.isArray(props)) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'class') { for (const c of String(v).split(/\s+/)) if (c) el.classList.add(c); }
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k in el && k !== 'list' && typeof v !== 'object') { try { el[k] = v; } catch (_) { el.setAttribute(k, v); } }
        else el.setAttribute(k, v === true ? '' : v);
      }
    } else if (props != null) {
      children.unshift(props);
    }
    append(el, children);
    return el;
  }
  function append(el, children) {
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  /** <select> with options [{value,label,group?,disabled?,class?}] */
  function select(opts, value, onChange, attrs) {
    const sel = h('select', attrs || {});
    const groups = new Map();
    for (const o of opts) {
      const opt = h('option', { value: o.value, disabled: !!o.disabled, class: o.class || null }, o.label);
      if (o.group) {
        if (!groups.has(o.group)) { const g = h('optgroup', { label: o.group }); groups.set(o.group, g); sel.append(g); }
        groups.get(o.group).append(opt);
      } else sel.append(opt);
    }
    if (value != null) sel.value = String(value);
    if (onChange) sel.addEventListener('change', () => onChange(sel.value));
    return sel;
  }

  /** Star rating picker 1..max */
  function starPicker(value, max, onChange, attrs) {
    const wrap = h('div.stars', Object.assign({ role: 'radiogroup', 'aria-label': 'Star level' }, attrs || {}));
    for (let i = 1; i <= max; i++) {
      const b = h('button', {
        type: 'button', role: 'radio', 'aria-checked': i === value ? 'true' : 'false', 'aria-label': `${i} star`,
        class: i <= value ? 'on' : '', title: `${i}★`,
        onclick: () => onChange(i),
      }, '★');
      wrap.append(b);
    }
    return wrap;
  }

  function numberInput(value, { min, max, step, onChange, width, attrs } = {}) {
    const inp = h('input', Object.assign({ type: 'number', value: value ?? '', min, max, step: step ?? 'any', inputmode: 'decimal' }, attrs || {}));
    if (width) inp.style.width = width;
    const clamp = (v) => { if (v == null || !isFinite(v)) return null; if (min != null && v < Number(min)) v = Number(min); if (max != null && v > Number(max)) v = Number(max); return v; };
    if (onChange) {
      inp.addEventListener('input', () => onChange(inp.value === '' ? null : clamp(Number(inp.value))));
      inp.addEventListener('change', () => { const v = inp.value === '' ? null : clamp(Number(inp.value)); if (v != null && String(v) !== inp.value) inp.value = String(v); onChange(v); });
    }
    return inp;
  }

  function switchInput(checked, label, onChange, attrs) {
    const input = h('input', Object.assign({ type: 'checkbox', checked: !!checked }, attrs || {}));
    input.addEventListener('change', () => onChange(input.checked));
    return h('label.switch', input, h('span', label));
  }

  function panel(id, title, bodyChildren, { headerExtra, collapsed } = {}) {
    const body = h('div.body', bodyChildren);
    const toggle = h('button.toggle', { type: 'button', 'aria-label': 'Collapse section', title: 'Collapse / expand' }, collapsed ? '▸' : '▾');
    const el = h(`section.panel#${id}`, { class: collapsed ? 'collapsed' : '' },
      h('header', h('h2', title), headerExtra || null, toggle), body);
    toggle.addEventListener('click', () => {
      el.classList.toggle('collapsed');
      toggle.textContent = el.classList.contains('collapsed') ? '▸' : '▾';
      storage.set('collapsed:' + id, el.classList.contains('collapsed'));
    });
    return el;
  }

  const storage = {
    get(key, fallback) { try { const v = localStorage.getItem('ohbp:' + key); return v == null ? fallback : JSON.parse(v); } catch (_) { return fallback; } },
    set(key, value) { try { localStorage.setItem('ohbp:' + key, JSON.stringify(value)); } catch (_) { /* storage unavailable */ } },
    remove(key) { try { localStorage.removeItem('ohbp:' + key); } catch (_) { /* ignore */ } },
  };

  /** Compact URL-safe encoding of a build object (JSON -> UTF-8 -> base64url). */
  function encodeState(obj) {
    const json = JSON.stringify(obj);
    const bytes = new TextEncoder().encode(json);
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeState(str) {
    try {
      const b64 = str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4);
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (_) { return null; }
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  const fmt = {
    num(v, digits = 0) { if (v == null || !isFinite(v)) return '–'; return Number(v).toLocaleString('en-US', { maximumFractionDigits: digits, minimumFractionDigits: digits }); },
    pct(v, digits = 1) { if (v == null || !isFinite(v)) return '–'; return (v >= 0 ? '+' : '') + Number(v).toFixed(digits) + '%'; },
    mult(v, digits = 3) { if (v == null || !isFinite(v)) return '–'; return '×' + Number(v).toFixed(digits); },
    signed(v, digits = 0) { if (v == null || !isFinite(v)) return '–'; return (v > 0 ? '+' : '') + Number(v).toLocaleString('en-US', { maximumFractionDigits: digits }); },
  };

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  global.UI = { h, append, clear, select, starPicker, numberInput, switchInput, panel, storage, encodeState, decodeState, toast, fmt, debounce };
})(window);

</script>

    const kws = [['Shrapnel', 'shrapnel'], ['Bounce', 'bounce'], ['Burn', 'burn'], ['Frost Vortex', 'frostVortex'], ['Power Surge', 'powerSurge'], ['Unstable Bomber', 'unstableBomber'], ["The Bull's Eye", 'bullsEye'], ['Fast Gunner', 'fastGunner'], ['Fortress Warfare', 'fortressWarfare']];
    const els = [['Blaze', 'blaze'], ['Frost', 'frost'], ['Blast', 'blast'], ['Shock', 'shock']];
    if (/^<keyword> dmg/i.test(l)) return kws.map(([n, id]) => ({ label: `${n} DMG`, stat: 'keywordDmgPct', key: id, defaultValue: 10 }));
    if (/^<keyword> trigger chance/i.test(l)) return kws.map(([n, id]) => ({ label: `${n} Trigger Chance`, stat: 'statusChancePct', key: null, defaultValue: 6 }));
    if (/^<keyword> duration/i.test(l)) return [];
    if (/^<keyword> crit dmg/i.test(l)) return kws.map(([n, id]) => ({ label: `${n} Crit DMG`, stat: 'keywordCritDmgPct', key: id, defaultValue: 15 })).concat(kws.map(([n, id]) => ({ label: `${n} Weakspot DMG`, stat: 'keywordWeakspotDmgPct', key: id, defaultValue: 9 })));
    if (/^<element> elemental dmg/i.test(l)) return els.map(([n, id]) => ({ label: `${n} Elemental DMG`, stat: 'elementalDmgPct', key: id, defaultValue: 10 }));
    if (/instant keyword dmg|bullet-effect dmg/i.test(l)) return [];
    if (/^dmg vs normal/i.test(l)) return [{ label: 'DMG vs Normal', stat: 'dmgVsPct', key: 'normal' }];
    if (/^dmg vs elite/i.test(l)) return [{ label: 'DMG vs Elite', stat: 'dmgVsPct', key: 'elite' }];
    if (/^dmg vs boss/i.test(l)) return [{ label: 'DMG vs Boss / Great Ones', stat: 'dmgVsPct', key: 'boss' }];
    if (/^dmg reduction/i.test(l)) return [{ label: 'DMG Reduction', stat: 'dmgReductionPct', key: null, defaultValue: 5 }];
    if (/^reload/i.test(l)) return [{ label: 'Reload Efficiency', stat: 'reloadEfficiencyPct', key: null, defaultValue: 10 }];
    if (/^elemental dmg/i.test(l)) return [{ label: 'Elemental DMG (all)', stat: 'elementalDmgPct', key: 'all' }];
    if (/^psi intensity/i.test(l)) return [{ label: 'Psi Intensity', stat: 'psiIntensity', key: null, defaultValue: 30 }];
    if (/^max hp/i.test(l)) return [{ label: 'Max HP %', stat: 'maxHpPct', key: null, defaultValue: 5 }];
    if (/^crit rate/i.test(l)) return [{ label: 'Crit Rate', stat: 'critRatePct', key: null, defaultValue: 5 }];
    if (/^magazine/i.test(l)) return [{ label: 'Magazine Capacity', stat: 'magazinePct', key: null, defaultValue: 10 }];
    if (/^fire rate/i.test(l)) return [{ label: 'Fire Rate', stat: 'fireRatePct', key: null, defaultValue: 5 }];
    if (/^pollution/i.test(l)) return [{ label: 'Pollution Resist', stat: 'pollutionResist', key: null, defaultValue: 10 }];
    if (/^movement/i.test(l)) return [{ label: 'Movement Speed', stat: 'movementSpeedPct', key: null, defaultValue: 5 }];
    const r = E.resolveStat(l);
    return [{ label: l, stat: r.stat, key: r.key || null }];
  }

  function buildFood(raw) {
    const items = [];
    for (const it of raw.items || []) {
      const buffs = (it.buffs || []).filter(b => b && b.value != null && !isNaN(Number(b.value)));
      if (!buffs.length) continue;
      const effects = buffs.map(b => toEffects(b.stat, b.value, { unit: b.unit === 'flat' ? 'flat' : (b.unit || 'percent'), condition: b.condition || null, source: it.name, sourceType: 'food' })).flat();
      for (const fx of effects) { fx.conditional = isConditionalText(fx.condition); fx.id = `${slug(it.name)}:${fx.stat}:${fx.key || ''}`; }
      const combat = effects.some(e => e.stat !== 'other');
      const slot = (it.buffSlot || (/(drink|beverage)/i.test(it.category) ? 'drink' : 'food')).toLowerCase();
      items.push({ id: slug(it.name), name: it.name, category: it.category || 'food', slot: slot === 'drink' ? 'drink' : 'food', combatRelevant: it.combatRelevant != null ? !!it.combatRelevant : combat, effects, durationSeconds: it.durationSeconds || null, chefRexNote: it.chefRexBoostedPower || null, disagreement: it.disagreement || null, confidence: it.confidence || null, rawBuffs: buffs });
    }
    items.sort((a, b) => a.name.localeCompare(b.name));
    return { items, byId: Object.fromEntries(items.map(i => [i.id, i])), stackingRules: raw.stackingRules || null, chefRex: { 5: { high: 38, mid: 31, low: 25 }, 4: { high: 32, mid: 26, low: 20 }, 3: { high: 26, mid: 21, low: 15 } } };
  }

  function buildCradle(raw) {
    const c = raw.cradle || {};
    const live = (c.nodes || []).filter(n => n.pool !== 'datamine_placeholder' && n.pool !== 'legacy_variant' && n.pool !== 'legacy_general_1.0' && !n.valuesLookUnscaled);
    const nodes = [];
    const seen = new Set();
    for (const n of live) {
      const key = slug(n.name) + ':' + slug(n.effectText || '');
      if (seen.has(key)) continue; seen.add(key);
      const effects = (n.effects || []).map(e => toEffects(e.stat, e.value, { unit: e.unit, condition: e.condition, source: n.name, sourceType: 'cradle', text: n.effectText })).flat();
      for (const fx of effects) {
        const typeOnly = fx.stat === 'dmgVsPct';
        fx.conditional = !typeOnly && isConditionalText(fx.condition || n.effectText);
        const perStack = /per stack|each stack|every stack|per (hit|kill|shot|trigger)|stack/i.test(fx.condition || n.effectText || '') && !!n.maxStacks;
        if (perStack) stackify(fx, { perStack: true, maxStacks: n.maxStacks });
        fx.id = `${slug(n.name)}-${n.idSuffix || ''}:${fx.stat}:${fx.key || ''}`;
      }
      nodes.push({ id: slug(n.name) + (n.idSuffix ? '-' + n.idSuffix : ''), name: n.name, style: n.style || null, pool: n.pool, text: n.effectText || '', effects, durationSec: n.durationSec || null, maxStacks: n.maxStacks || null, ohdbUrl: n.ohdbUrl || null });
    }
    nodes.sort((a, b) => a.name.localeCompare(b.name) || (a.pool || '').localeCompare(b.pool || ''));
    return { nodes, byId: Object.fromEntries(nodes.map(n => [n.id, n])), maxActive: c.maxActiveNodes || 8 };
  }

  function buildDeviants(raw) {
    const list = [];
    for (const d of raw.deviants || []) {
      const skill = d.skill || {};
      const effects = [];
      const effList = skill.effects || [];
      for (const e of effList) {
        if (e.value == null || isNaN(Number(e.value))) continue;
        if (/cap$/i.test(e.stat)) continue; // handled with its sibling
        const bySR = Array.isArray(e.valueBySkillRating) && e.valueBySkillRating.length === 5 ? e.valueBySkillRating : null;
        const cap = effList.find(x => x.stat === e.stat + 'Cap');
        const fx = toEffects(e.stat, e.value, { unit: e.unit, condition: e.condition, source: d.name, sourceType: 'deviant', target: e.target || 'player' });
        for (const f of fx) {
          f.target = e.target || 'player'; f.valueBySkillRating = bySR; f.conditional = false; f.id = `${slug(d.name)}:${f.stat}:${f.key || ''}`; f.rawStat = e.stat;
          f.condition = cleanCondition(e.condition);
          if (cap && cap.value) { f.perStack = true; f.perStackValue = f.value; f.baseValue = 0; f.maxValue = cap.value; f.maxStacks = Math.max(1, Math.round(cap.value / f.value)); f.capBySkillRating = Array.isArray(cap.valueBySkillRating) ? cap.valueBySkillRating : null; }
        }
        effects.push(...fx);
      }
      list.push({ id: slug(d.name), name: d.name, type: d.type || 'Combat', text: cleanCondition(skill.text) || '', effects, damage: skill.damage || null, cooldownSeconds: d.cooldownSeconds || null, durationSeconds: d.durationSeconds || null, notes: d.notes || null, traits: d.traits || [], variants: d.variants || [] });
    }
    list.sort((a, b) => a.name.localeCompare(b.name));
    return { list, byId: Object.fromEntries(list.map(d => [d.id, d])), scalingRules: raw.scalingRules || null };
  }

  function buildCalibration(raw) {
    const styles = [];
    for (const c of raw.weaponCalibrations || []) {
      const lvl = (c.levels && c.levels[0]) || { bonuses: {} };
      const b = lvl.bonuses || {};
      const effects = [];
      const add = (stat, v, key) => { if (v != null && !isNaN(Number(v)) && Number(v) !== 0) effects.push(Object.assign(E.effect(stat, v, { key, source: c.name, sourceType: 'calibration' }), { id: `${slug(c.name)}:${stat}` })); };
      add('attackPct', b.attack); add('rangePct', b.range); add('fireRatePct', b.fireRate); add('reloadEfficiencyPct', b.reloadSpeed); add('magazinePct', b.magazineCapacity);
      const hasValues = effects.length > 0;
      styles.push({ id: slug(c.name), name: c.name, style: c.style || null, appliesTo: c.appliesTo || [], effects, hasValues, otherBonuses: Object.fromEntries(Object.entries(b).filter(([k]) => !['attack', 'range', 'fireRate', 'reloadSpeed', 'magazineCapacity'].includes(k))), confidence: c.confidence || null });
    }
    const sys = (raw.calibrationSystem && raw.calibrationSystem.current) || {};
    const attackBonus = (sys.blueprintAttributeStructure && sys.blueprintAttributeStructure.guaranteedAttackBonus && sys.blueprintAttributeStructure.guaranteedAttackBonus.byRarity) || {};
    const randomPool = ['Crit Rate', 'Crit DMG', 'Elemental DMG', 'Weakspot DMG'];
    const randomDefaults = { 'Crit Rate': { stat: 'critRatePct', max: 20 }, 'Crit DMG': { stat: 'critDmgPct', max: 20 }, 'Elemental DMG': { stat: 'elementalDmgPct', max: 20, key: 'all' }, 'Weakspot DMG': { stat: 'weakspotDmgPct', max: 20 } };
    return { styles, byId: Object.fromEntries(styles.map(s => [s.id, s])), attackBonusByRarity: attackBonus, randomPool, randomDefaults, classMap: CLASS_TO_CALIB, system: sys };
  }

  function buildStatusEffects(formula) {
    const out = {};
    for (const s of (formula && formula.statusEffects) || []) {
      const id = s.id;
      const m = String(s.damageFormula || '').match(/(\d+(?:\.\d+)?)%\s*x\s*(PsiIntensity|Attack)/i);
      const factor = m ? Number(m[1]) : null;
      const scalesWith = m ? (/attack/i.test(m[2]) ? 'attack' : 'psi') : (Array.isArray(s.scalesWith) && s.scalesWith.some(x => /attack|weapon/i.test(x)) ? 'attack' : 'psi');
      const tick = String(s.damageFormula || '').match(/per tick/i) ? ((s.tickSeconds) || (id === 'burn' || id === 'frostVortex' ? 0.5 : null)) : null;
      out[id] = { id, name: s.name, baseFactorPct: s.baseFactorPct != null ? s.baseFactorPct : factor, scalesWith: s.scalesWith === 'attack' ? 'attack' : (s.scalesWith === 'psi' ? 'psi' : scalesWith), element: s.element || E.KEYWORD_ELEMENT[id] || null, tickSeconds: s.tickSeconds != null ? s.tickSeconds : tick, durationSeconds: s.durationSeconds != null ? s.durationSeconds : (id === 'burn' ? 6 : id === 'frostVortex' ? 4 : null), maxStacks: s.maxStacks || 1, canCrit: s.canCrit, canWeakspot: s.canWeakspot, trigger: s.trigger || null, effect: s.effect || null, notes: s.notes || null, formula: s.damageFormula || null, verified: s.verified || null };
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // Build -> effects
  // ---------------------------------------------------------------------------
  function defaultBuild(cat) {
    const w = cat.weapons.list.find(x => /The Last Valor/i.test(x.name) && x.attack != null) || cat.weapons.list.find(x => x.attackSource === 'official') || cat.weapons.list[0];
    return {
      v: 1,
      weapon: { id: w ? w.id : null, star: 6, calibration: { styleId: null, attackBonusPct: 50, random: (w && w.element && w.element !== 'physical') ? { stat: 'Elemental DMG', value: 20 } : { stat: 'Crit DMG', value: 20 } }, mod: { id: null, substats: [] } },
      armor: Object.fromEntries(SLOTS.map(s => [s, { pieceId: null, star: 6, mod: { id: null, substats: [] } }])),
      food: { foodId: null, drinkId: null, chefRex: false, chefRexRating: 5, chefRexMood: 'high' },
      deviant: { id: null, skillRating: 5, active: true },
      cradle: { nodeIds: [] },
      target: { faction: 'deviant', tier: 'boss', vulnerabilityPct: 0, mitigation: 100 },
      toggles: {},        // effectId -> boolean (conditional effects on/off)
      stacks: {},         // effectId -> number of stacks
      options: { critWeakspotModel: 'additive', elementalAffectsBullets: true, attackAndWeaponDmgSeparate: true, statusKeywordSeparate: false, damagePoolModel: 'multiplicative', weakspotZoneMult: 1, includeFood: true },
    };
  }

  /** An example loadout so the planner opens in a working state (clearly marked in the UI). */
  function exampleBuild(cat) {
    const b = defaultBuild(cat);
    const find = (list, re) => list.find(x => re.test(x.name));
    for (const p of cat.armor.pieces) if (p.setId === 'lonewolf-set' && SLOTS.includes(p.slot)) b.armor[p.slot].pieceId = p.id;
    const food = find(cat.food.items.filter(i => i.slot === 'food' && i.combatRelevant), /Shattered Bread|Crumbly Bread|Stargazy/i);
    const drink = find(cat.food.items.filter(i => i.slot === 'drink' && i.combatRelevant), /Signature Beverage|Whimsical|Energy Drink/i) || cat.food.items.find(i => i.slot === 'drink' && i.combatRelevant);
    if (food) b.food.foodId = food.id;
    if (drink) b.food.drinkId = drink.id;
    const dev = find(cat.deviants.list, /Butterfly/i);
    if (dev) b.deviant.id = dev.id;
    const wantNodes = [/^Steady Hand/i, /^Marked Strike/i, /^Tactical Combo/i, /^Assault Rifle Enhancement|^Rifle Enhancement/i];
    for (const re of wantNodes) { const n = cat.cradle.nodes.find(x => re.test(x.name) && x.effects.some(e => e.stat !== 'other')); if (n && b.cradle.nodeIds.length < cat.cradle.maxActive) b.cradle.nodeIds.push(n.id); }
    const mod = find(cat.mods.weaponMods, /Shrapnel Smash|Shrapnel Carnage/i);
    if (mod) { b.weapon.mod.id = mod.id; b.weapon.mod.substats = [{ id: 'weapon-dmg', value: 10 }, { id: 'crit-dmg', value: 15 }, { id: 'weakspot-dmg', value: 9 }, { id: 'shrapnel-dmg', value: 10 }].map(s => cat.mods.substatsById[s.id] ? s : { id: null, value: null }); }
    b.example = true;
    return b;
  }

  /** Expand a catalogue effect into an engine effect honouring toggles and stacks. */
  function applyEffect(fx, build, { forceEnabled } = {}) {
    const toggled = build.toggles[fx.id];
    let enabled = fx.conditional ? (toggled === true) : (toggled !== false);
    if (forceEnabled) enabled = true;
    let value = fx.value;
    if (fx.perStack) {
      let stacks = build.stacks[fx.id] != null ? Number(build.stacks[fx.id]) : (fx.maxStacks || 1);
      if (!isFinite(stacks)) stacks = fx.maxStacks || 1;
      stacks = Math.max(0, Math.round(stacks));
      if (fx.maxStacks) stacks = Math.min(stacks, fx.maxStacks);
      const per = fx.perStackValue != null ? fx.perStackValue : fx.value;
      value = (fx.baseValue || 0) + per * stacks;
      if (fx.maxValue != null) value = Math.min(value, fx.maxValue);
    }
    return Object.assign({}, fx, { value, enabled });
  }

  function collectEffects(build, cat, { includeFood = true } = {}) {
    build = Object.assign({ toggles: {}, stacks: {}, armor: {}, food: {}, deviant: {}, cradle: { nodeIds: [] }, target: {}, options: {} }, build || {});
    build.weapon = Object.assign({ calibration: {}, mod: {} }, build.weapon || {});
    build.toggles = build.toggles || {}; build.stacks = build.stacks || {}; build.food = build.food || {}; build.deviant = build.deviant || {}; build.cradle = build.cradle || { nodeIds: [] };
    const out = [];
    const push = (fx) => { if (fx && fx.stat && fx.stat !== 'other') out.push(fx); else if (fx) out.push(fx); };
    // Weapon special effect is part of the weapon card and handled via keyword; calibration:
    const cal = build.weapon.calibration || {};
    if (cal.styleId && cat.calibration.byId[cal.styleId]) for (const fx of cat.calibration.byId[cal.styleId].effects) push(Object.assign({}, fx, { enabled: true }));
    if (cal.attackBonusPct) push(Object.assign(E.effect('attackPct', cal.attackBonusPct, { source: 'Calibration: Attack bonus', sourceType: 'calibration' }), { id: 'calibration:attackBonus', enabled: true }));
    if (cal.random && cal.random.stat && cal.random.value) {
      const def = cat.calibration.randomDefaults[cal.random.stat];
      if (def) push(Object.assign(E.effect(def.stat, cal.random.value, { key: cal.random.key || def.key || null, source: `Calibration: ${cal.random.stat}`, sourceType: 'calibration' }), { id: 'calibration:random', enabled: true }));
    }
    const curWeapon = cat.weapons.byId[build.weapon.id] || {};
    const weaponKeyword = curWeapon.keyword || null;
    const keywordOk = (kw) => !kw || kw === weaponKeyword;
    // Weapon's own effect (intrinsic bonuses)
    for (const fx of (curWeapon.intrinsics && curWeapon.intrinsics.effects) || []) push(applyEffect(fx, build));
    // Weapon mod
    pushMod(build.weapon.mod, 'weapon-mod');
    // Armor pieces, set bonuses, mods
    const setCounts = {};
    for (const slot of SLOTS) {
      const sel = build.armor[slot];
      if (!sel || !sel.pieceId) continue;
      const piece = cat.armor.piecesById[sel.pieceId];
      if (!piece) continue;
      const bs = cat.armor.baseStatsAt(piece, sel.star || 1);
      if (bs.maxHp != null) push(Object.assign(E.effect('maxHp', bs.maxHp, { source: `${piece.name} (${sel.star || 1}★)`, sourceType: 'armor-base' }), { id: `${piece.id}:maxHp`, enabled: true }));
      if (bs.psiIntensity != null) push(Object.assign(E.effect('psiIntensity', bs.psiIntensity, { source: `${piece.name} (${sel.star || 1}★)`, sourceType: 'armor-base' }), { id: `${piece.id}:psi`, enabled: true }));
      if (bs.pollutionResist != null) push(Object.assign(E.effect('pollutionResist', bs.pollutionResist, { source: piece.name, sourceType: 'armor-base' }), { id: `${piece.id}:pr`, enabled: true }));
      if (keywordOk(piece.keyword)) for (const fx of piece.effects) push(applyEffect(fx, build));
      if (piece.setId) setCounts[piece.setId] = (setCounts[piece.setId] || 0) + 1;
      pushMod(sel.mod, 'armor-mod');
    }
    for (const [setId, n] of Object.entries(setCounts)) {
      const set = cat.armor.setsById[setId];
      if (!set) continue;
      const active = set.bonuses.filter(b => n >= b.pieces);
      const stackRaise = active.flatMap(b => b.effects).find(fx => /MaxStacks$/i.test(fx.rawStat || '') && fx.stat === 'other');
      for (const b of active) for (const fx of b.effects) {
        let f = fx;
        if (stackRaise && fx.perStack && fx.stat !== 'other') f = Object.assign({}, fx, { maxStacks: stackRaise.value });
        push(applyEffect(f, build));
      }
    }
    // Food & drink
    if (includeFood) {
      for (const key of ['foodId', 'drinkId']) {
        const item = build.food[key] && cat.food.byId[build.food[key]];
        if (!item) continue;
        const mult = build.food.chefRex ? 1 + ((cat.food.chefRex[build.food.chefRexRating] || cat.food.chefRex[5])[build.food.chefRexMood || 'high'] || 0) / 100 : 1;
        for (const fx of item.effects) { const a = applyEffect(fx, build); if (fx.stat !== 'psiIntensity' && fx.stat !== 'pollutionResist' && fx.stat !== 'maxHp') a.value = a.value * mult; else a.value = a.value * mult; push(a); }
      }
    }
    // Deviant
    if (build.deviant.id && build.deviant.active !== false) {
      const d = cat.deviants.byId[build.deviant.id];
      if (d) for (const fx of d.effects) {
        const sr = Math.max(1, Math.min(5, build.deviant.skillRating || 5));
        let f = fx;
        if (fx.valueBySkillRating) {
          const v = fx.valueBySkillRating[sr - 1];
          f = Object.assign({}, fx, { value: v, perStackValue: fx.perStack ? v : fx.perStackValue, maxValue: fx.capBySkillRating ? fx.capBySkillRating[sr - 1] : fx.maxValue });
        }
        push(applyEffect(f, build));
      }
    }
    // Cradle
    for (const id of build.cradle.nodeIds || []) {
      const n = cat.cradle.byId[id];
      if (n) for (const fx of n.effects) push(applyEffect(fx, build));
    }
    // Target debuffs
    const tgt = build.target || {};
    if (tgt.vulnerabilityPct) { push(Object.assign(E.effect('weaponVulnPct', tgt.vulnerabilityPct, { source: 'Target: extra Vulnerability', sourceType: 'target' }), { id: 'target:vuln', enabled: true })); push(Object.assign(E.effect('statusVulnPct', tgt.vulnerabilityPct, { source: 'Target: extra Vulnerability', sourceType: 'target' }), { id: 'target:vuln-status', enabled: true })); }
    return out;

    function pushMod(modSel, kind) {
      if (!modSel || !modSel.id) return;
      const mod = cat.mods.byId[modSel.id];
      if (!mod) return;
      if (keywordOk(mod.keyword)) for (const fx of mod.effects) push(applyEffect(fx, build));
      const seen = new Set();
      for (const ss of modSel.substats || []) {
        const def = cat.mods.substatsById[ss.id];
        if (!def || ss.value == null || seen.has(ss.id)) continue;
        seen.add(ss.id);
        push(Object.assign(E.effect(def.stat, ss.value, { key: def.key, source: `${mod.name}: ${def.label}`, sourceType: kind + '-sub' }), { id: `${mod.id}:sub:${def.id}`, enabled: true }));
      }
    }
  }

  function computeBuild(build, cat, { includeFood } = {}) {
    const w = build && build.weapon && cat.weapons.byId[build.weapon.id];
    if (!w) return null;
    const options = build.options || {}, target = build.target || {};
    const inc = includeFood != null ? includeFood : options.includeFood !== false;
    const effects = collectEffects(build, cat, { includeFood: inc });
    const weapon = Object.assign({}, w, { attackByStar: w.attackByStar, attackStar: 1, statusChancePct: build.weapon.triggerChancePct != null ? build.weapon.triggerChancePct : w.triggerChancePct, statusChanceBasis: build.weapon.triggerChancePct != null ? 'hit' : w.triggerChanceBasis });
    const ctx = {
      targetType: [target.faction || 'deviant', target.tier || 'boss'].filter(Boolean),
      starTable: cat.weapons.starTable,
      statusEffects: cat.statusEffects,
      options: Object.assign({}, options, { mitigation: (target.mitigation != null ? target.mitigation : 100) / 100 }),
    };
    const result = E.computeDamage(weapon, build.weapon.star || 1, effects, ctx);
    result.effects = effects;
    result.weapon = w;
    return result;
  }

  function buildCatalog(data) {
    const cat = {};
    cat.meta = { generated: {}, versions: {} };
    for (const [k, v] of Object.entries(data)) if (v && v._meta) cat.meta.versions[k] = v._meta.gameVersion || null;
    cat.weapons = buildWeapons(data.weapons || { weapons: [] }, data.official_weapons || null, data.weapon_intrinsics || null);
    cat.armor = buildArmor(data.armor || { sets: [], keyArmor: [], slots: [] });
    cat.mods = buildMods(data.mods || {});
    cat.food = buildFood(data.food || {});

      }
      setBox.append(box);
    }
    body.push(setBox);
    return panel('p-armor', 'Armor', body, { collapsed: collapsedState('p-armor') });
  }

  // --- Food -------------------------------------------------------------------
  function foodPanel() {
    const f = build.food;
    const foods = cat.food.items.filter(i => i.slot === 'food');
    const drinks = cat.food.items.filter(i => i.slot === 'drink');
    const opt = (items) => [{ value: '', label: 'None' }].concat(items.map(i => ({ value: i.id, label: i.name + (i.combatRelevant ? '' : ' (utility)'), group: i.combatRelevant ? 'Combat buffs' : 'Other buffs' })));
    const body = [];
    body.push(h('p.note.small', 'One food buff and one drink buff can be active at a time; they stack with each other. Results always show the build with and without these buffs.'));
    body.push(h('div.row',
      h('div.field', h('label', { for: 'food-sel' }, 'Food'), select(opt(foods), f.foodId || '', v => set(() => { f.foodId = v || null; }), { id: 'food-sel' })),
      h('div.field', h('label', { for: 'drink-sel' }, 'Drink'), select(opt(drinks), f.drinkId || '', v => set(() => { f.drinkId = v || null; }), { id: 'drink-sel' })),
    ));
    for (const key of ['foodId', 'drinkId']) {
      const it = f[key] && cat.food.byId[f[key]];
      if (!it) continue;
      body.push(h('div.slot', h('div.slot-head', h('span.slot-name', it.name), h('span.faint.small', it.durationSeconds ? `${Math.round(it.durationSeconds / 60)} min` : '')), effectList(it.effects), it.disagreement ? h('p.note.warn', 'Sources disagree: ' + it.disagreement) : null));
    }
    body.push(h('div.row',
      switchInput(f.chefRex, 'Chefosaurus Rex cooked (boosts dish values)', v => set(() => { f.chefRex = v; }), { id: 'chef-rex' }),
      f.chefRex ? h('div.field.narrow', h('label', { for: 'chef-rating' }, 'Rating'), select([3, 4, 5].map(n => ({ value: n, label: `${n} ★` })), f.chefRexRating, v => set(() => { f.chefRexRating = Number(v); }), { id: 'chef-rating' })) : null,
      f.chefRex ? h('div.field.narrow', h('label', { for: 'chef-mood' }, 'Mood'), select([{ value: 'high', label: 'Active ≥90' }, { value: 'mid', label: 'Active 20–89' }, { value: 'low', label: 'Active <20' }], f.chefRexMood, v => set(() => { f.chefRexMood = v; }), { id: 'chef-mood' })) : null,
    ));
    return panel('p-food', 'Food & drink', body, { collapsed: collapsedState('p-food') });
  }

  // --- Deviant ----------------------------------------------------------------
  function deviantPanel() {
    const d = build.deviant;
    const opts = [{ value: '', label: 'None' }].concat(cat.deviants.list.map(x => ({ value: x.id, label: x.name + (x.effects.length ? '' : ' (no stat effect)') })));
    const body = [];
    body.push(h('div.row',
      h('div.field', h('label', { for: 'dev-sel' }, 'Combat deviation'), select(opts, d.id || '', v => set(() => { d.id = v || null; }), { id: 'dev-sel' })),
      h('div.field.narrow', h('label', { for: 'dev-sr' }, 'Skill rating'), select([1, 2, 3, 4, 5].map(n => ({ value: n, label: `${n}` })), d.skillRating || 5, v => set(() => { d.skillRating = Number(v); }), { id: 'dev-sr' })),
      switchInput(d.active !== false, 'Skill active on target', v => set(() => { d.active = v; }), { id: 'dev-active' }),
    ));
    const dev = d.id && cat.deviants.byId[d.id];
    if (dev) {
      body.push(h('p.note.small', dev.text));
      const fxs = dev.effects.map(fx => Object.assign({}, fx, { value: fx.valueBySkillRating ? fx.valueBySkillRating[(d.skillRating || 5) - 1] : fx.value }));
      if (fxs.length) body.push(effectList(fxs));
      else body.push(h('p.note', 'This deviation has no modelled stat effect on your weapon damage (its own skill damage is listed in the notes).'));
      if (dev.damage && dev.damage.formula) body.push(h('p.note.small', 'Skill damage: ' + dev.damage.formula));
    }
    body.push(h('p.note.small', 'Values scale linearly with Skill Rating (SR5 = 2× SR1), per decoded game-client formulas.'));
    return panel('p-deviant', 'Deviation', body, { collapsed: collapsedState('p-deviant') });
  }

  // --- Cradle -----------------------------------------------------------------
  function cradlePanel() {
    const c = build.cradle;
    const body = [];
    const picked = c.nodeIds.map(id => cat.cradle.byId[id]).filter(Boolean);
    body.push(h('p.note.small', `Up to ${cat.cradle.maxActive} Cradle Overrides. ${picked.length}/${cat.cradle.maxActive} selected.`));
    const opts = [{ value: '', label: 'Add an override…' }].concat(cat.cradle.nodes.filter(n => !c.nodeIds.includes(n.id)).map(n => ({ value: n.id, label: (`${n.name} – ${n.text}`.length > 72 ? `${n.name} – ${n.text}`.slice(0, 70) + '…' : `${n.name} – ${n.text}`), group: n.style || 'Other' })));
    body.push(h('div.field', h('label', { for: 'cradle-add' }, 'Add override'), select(opts, '', v => { if (!v) return; if (c.nodeIds.length >= cat.cradle.maxActive) { toast(`Maximum ${cat.cradle.maxActive} overrides`); document.getElementById('cradle-add').value = ''; return; } set(() => { c.nodeIds.push(v); }); }, { id: 'cradle-add' })));
    const list = h('div.slots');
    for (const n of picked) {
      list.append(h('div.slot',
        h('div.slot-head', h('span.slot-name', n.name), h('button.btn.small.ghost', { type: 'button', onclick: () => set(() => { c.nodeIds = c.nodeIds.filter(x => x !== n.id); }) }, 'Remove')),
        h('p.note.small', n.text),
        n.effects.length ? effectList(n.effects) : null,
      ));
    }
    body.push(list);
    return panel('p-cradle', 'Cradle overrides', body, { collapsed: collapsedState('p-cradle') });
  }

  // --- Target -----------------------------------------------------------------
  function targetPanel() {
    const t = build.target;
    const body = [h('div.row',
      h('div.field', h('label', { for: 'tgt-faction' }, 'Enemy type'), select(E.TARGET_FACTIONS.map(f => ({ value: f, label: prettyKey(f) })), t.faction, v => set(() => { t.faction = v; }), { id: 'tgt-faction' })),
      h('div.field', h('label', { for: 'tgt-tier' }, 'Enemy tier'), select(E.TARGET_TIERS.map(f => ({ value: f, label: prettyKey(f) })), t.tier, v => set(() => { t.tier = v; }), { id: 'tgt-tier' })),
      h('div.field.narrow', h('label', { for: 'tgt-vuln' }, 'Extra Vulnerability %'), numberInput(t.vulnerabilityPct, { min: 0, max: 200, step: 1, attrs: { id: 'tgt-vuln' }, onChange: v => set(() => { t.vulnerabilityPct = v || 0; }, { structural: false }) })),
      h('div.field.narrow', h('label', { for: 'tgt-mit' }, 'Damage taken %'), numberInput(t.mitigation, { min: 1, max: 200, step: 1, attrs: { id: 'tgt-mit', title: 'Enemy level / armour mitigation is not published; 100 = no reduction' }, onChange: v => set(() => { t.mitigation = v || 100; }, { structural: false }) })),
    ), h('p.note.small', 'DMG-vs-type bonuses apply to the selected type and tier. Enemy level and armour mitigation have no published formula; use "Damage taken %" to approximate it.')];
    return panel('p-target', 'Target', body, { collapsed: collapsedState('p-target') });
  }

  // --- Options ----------------------------------------------------------------
  function optionsPanel() {
    const o = build.options;
    const body = [
      h('div.field', h('label', { for: 'opt-cw' }, 'Crit × Weakspot on one hit'), select([{ value: 'additive', label: '1 + Crit DMG + Weakspot DMG (one bucket; most community calculators)' }, { value: 'multiplicative', label: '(1 + Crit DMG) × (1 + Weakspot DMG)' }], o.critWeakspotModel, v => set(() => { o.critWeakspotModel = v; }), { id: 'opt-cw' })),
      switchInput(o.elementalAffectsBullets, 'Matching Elemental DMG % also multiplies an elemental weapon\'s own bullets (default on; off = status procs only)', v => set(() => { o.elementalAffectsBullets = v; }), { id: 'opt-el' }),
      switchInput(o.attackAndWeaponDmgSeparate, 'Attack % and Weapon DMG % are separate multiplicative buckets (off = one additive bucket)', v => set(() => { o.attackAndWeaponDmgSeparate = v; }), { id: 'opt-aw' }),
      switchInput(o.statusKeywordSeparate, 'Status DMG % and keyword DMG % multiply as two buckets (off = one additive "DMG factor" pool)', v => set(() => { o.statusKeywordSeparate = v; }), { id: 'opt-sk' }),
      switchInput(o.damagePoolModel === 'additive', 'Single additive pool: Weapon DMG %, Elemental %, DMG-vs-type %, Vulnerability % and All DMG % add together (datamined formula graph; experimental)', v => set(() => { o.damagePoolModel = v ? 'additive' : 'multiplicative'; }), { id: 'opt-pool' }),
      h('div.row', h('div.field.narrow', h('label', { for: 'opt-zone' }, 'Weakspot zone multiplier'), numberInput(o.weakspotZoneMult != null ? o.weakspotZoneMult : 1, { min: 0.1, max: 5, step: 0.05, attrs: { id: 'opt-zone' }, onChange: v => set(() => { o.weakspotZoneMult = v || 1; }, { structural: false }) })), h('p.note.small', { style: { flex: '1 1 240px' } }, 'Enemy body-part multiplier on weakspot hits (unknown; 1 = none).')),
    ];
    return panel('p-options', 'Formula options', body, { collapsed: collapsedState('p-options') });
  }

  // ---------------------------------------------------------------------------
  // Results
  // ---------------------------------------------------------------------------
  function renderResults() {
    clear(results);
    const withFood = A.computeBuild(build, cat, { includeFood: true });
    const noFood = A.computeBuild(build, cat, { includeFood: false });
    if (!withFood) { results.append(h('div.panel', h('div.body', h('p.note', 'Pick a weapon to see results.')))); return; }
    const hasFood = !!(build.food.foodId || build.food.drinkId);
    const r = withFood;
    const w = r.weapon;
    // KPIs
    const kp = h('div.panel', h('header', h('h2', `${w.name} · ${build.weapon.star}★`), build.example ? h('span.chip', { title: 'This is a sample loadout. Change anything to make it yours.' }, 'example build') : null), h('div.body',
      h('div.kpi-grid',
        kpi('Body hit', r.hits.normal, `attack ${fmt.num(r.attack.final)} · ×${r.multipliers.weaponDmgMult.toFixed(3)} wpn`),
        kpi('Crit hit', r.hits.crit, `${r.multipliers.critRatePct.toFixed(1)}% rate · +${r.multipliers.critDmgPct.toFixed(1)}% DMG`, 'crit'),
        kpi('Weakspot hit', r.hits.weakspot, `+${r.multipliers.weakspotPct.toFixed(1)}% weakspot`, 'weak'),
        kpi('Weakspot crit', r.hits.weakspotCrit, build.options.critWeakspotModel === 'additive' ? 'additive crit+weakspot' : 'multiplicative', 'weak'),
        kpi('Expected / shot (body)', r.expectedBody * r.inputs.pellets, r.inputs.pellets > 1 ? `${r.inputs.pellets} pellets` : 'crit-weighted average'),
        kpi('Expected / shot (weakspot)', r.expectedWeak * r.inputs.pellets, 'crit-weighted average'),
        r.status && r.status.perProc != null ? kpi(`${prettyKey(r.status.keyword)} proc`, r.status.perProc, r.status.model === 'psi' ? `Psi ${fmt.num(r.psi.effective)} × ${(r.status.factor * 100).toFixed(0)}%${r.status.tickSeconds ? ` per ${r.status.tickSeconds}s tick` : ''}${r.status.canCrit ? ` · crits ${r.status.critRatePct.toFixed(0)}% → ${fmt.num(r.status.perProcCrit)}` : ''}` : `${(r.status.factor * 100).toFixed(0)}% of hit · crit ${fmt.num(r.status.perProcCrit)} (${r.status.critRatePct.toFixed(0)}%)`, 'status') : (w.keyword ? kpi(`${prettyKey(w.keyword)}`, null, 'no numeric model yet', 'status') : null),
        kpi('Max HP', r.defense.maxHp, `Psi ${fmt.num(r.psi.effective)} · Pollution ${fmt.num(r.defense.pollutionResist)}`),
      ),
      r.rate.rpm > 0 ? h('div.kpi-grid', { style: { marginTop: '8px' } },
        kpi('Burst DPS', r.dps.totalBurstBody, `${fmt.num(r.rate.rpm)} RPM${r.dps.statusBurst ? ` · incl. ${fmt.num(r.dps.statusBurst)} status` : (r.status && r.status.perProc != null ? ' · status procs excluded (no trigger chance)' : '')}`),
        kpi('Sustained DPS', r.dps.totalSustainedBody, `mag ${r.rate.magazine} · reload ${r.rate.reloadTime.toFixed(2)}s`),
        kpi('Burst DPS (weakspot)', r.dps.totalBurstWeakspot, 'all shots on weakspot'),
        kpi('Magazine damage', r.dps.magazineDamageBody, 'body, crit-weighted'),
      ) : h('p.note.small', 'No rate-of-fire model for melee weapons; per-hit numbers only.'),
    ));
    results.append(kp);
    // With vs without food
    const cmp = E.compare(noFood, withFood);
    const rows = [['Body hit', 'normal', 0], ['Crit hit', 'crit', 0], ['Weakspot hit', 'weakspot', 0], ['Weakspot crit', 'weakspotCrit', 0], ['Expected / shot (body)', 'expectedBody', 0], ['Status proc', 'status', 1], ['Burst DPS', 'burstBody', 0], ['Sustained DPS', 'sustainedBody', 0], ['Max HP', 'maxHp', 0]];
    const table = h('table.cmp', h('thead', h('tr', h('th', 'Metric'), h('th', 'No food'), h('th', 'With food'), h('th', 'Δ'))));
    const tb = h('tbody');
    for (const [label, key, d] of rows) {
      const c = cmp[key]; if (!c) continue;
      tb.append(h('tr', h('td', label), h('td.num', fmt.num(c.a, d)), h('td.num', fmt.num(c.b, d)), h('td.num', { class: c.delta > 0 ? 'delta-up' : c.delta < 0 ? 'delta-down' : '' }, c.deltaPct != null ? fmt.pct(c.deltaPct, 1) : '–')));
    }
    table.append(tb);
    results.append(h('div.panel', h('header', h('h2', 'With food vs. without')), h('div.body', hasFood ? h('div.table-wrap', table) : h('p.note', 'No food or drink selected. Pick a dish or drink to compare.'))));
    // Star comparison
    const st = h('table.cmp', h('thead', h('tr', h('th', 'Stars'), h('th', 'Card DMG'), h('th', 'Body hit'), h('th', 'Weakspot crit'), h('th', 'Sustained DPS'))));
    const stb = h('tbody');
    const saved = build.weapon.star;
    for (let s = 1; s <= (w.maxStars || 6); s++) {
      build.weapon.star = s;
      const rs = A.computeBuild(build, cat, { includeFood: true });
      stb.append(h('tr', { class: s === saved ? 'total' : '' }, h('td', `${s}★`), h('td.num', fmt.num(rs.attack.atStar)), h('td.num', fmt.num(rs.hits.normal)), h('td.num', fmt.num(rs.hits.weakspotCrit)), h('td.num', fmt.num(rs.dps.totalSustainedBody))));
    }
    build.weapon.star = saved;
    st.append(stb);
    results.append(h('div.panel', h('header', h('h2', `1★ to ${w.maxStars || 6}★`)), h('div.body', h('div.table-wrap', st), h('p.note.small', w.rarity === 'epic' ? 'Epic blueprints cap at 5★ (official series ×1.00 / 1.056 / 1.112 / 1.167 / 1.223). Stars change nothing else on the card.' : 'Each star adds 5% of the 1★ card DMG (official blueprint table: ×1.00 / 1.05 / 1.10 / 1.15 / 1.20 / 1.25). Stars change nothing else on the card.'))));
    // Breakdown
    results.append(breakdownPanel(r));
    // Formula
    results.append(h('div.panel', h('header', h('h2', 'Formula')), h('div.body',
      h('pre.formula', formulaText(r)),
      h('details.breakdown', h('summary', 'Confidence notes'), h('ul.note.small',
        h('li', 'Base DMG per star: official blueprint tables, matches 33 in-game screenshots (high).'),
        h('li', 'Weapon DMG %, Crit, Weakspot and DMG-vs-type stacking: community-tested model shared by the main calculators (medium).'),
        h('li', 'Status proc = Psi × factor × (1 + Status DMG% + keyword DMG%) × (1 + Elemental%) × (1 + Final%) – reproduces the in-game 113 test (medium).'),
        h('li', 'Crit+Weakspot additive vs multiplicative is disputed; switch it in Formula options.'),
        h('li', 'Enemy level/armour mitigation and range falloff are not modelled unless you set "Damage taken %".'),
      )),
    )));
  }

  function kpi(k, v, sub, cls) { return h('div.kpi', { class: cls || '' }, h('div.k', k), h('div.v', v == null ? '–' : fmt.num(v, v < 100 ? 1 : 0)), sub ? h('div.sub', sub) : null); }

  function breakdownPanel(r) {
    const box = h('div.body');
    const groups = [
      ['Attack %', 'attackPct'], ['Attack (flat)', 'attackFlat'], ['Weapon DMG %', 'weaponDmgPct'], ['Crit Rate %', 'critRatePct'], ['Crit DMG %', 'critDmgPct'], ['Weakspot DMG %', 'weakspotDmgPct'],
      ['Elemental DMG %', 'elementalDmgPct'], ['Status DMG %', 'statusDmgPct'], ['Keyword DMG %', 'keywordDmgPct'], ['Final DMG %', 'finalDmgPct'], ['DMG vs type %', 'dmgVsPct'], ['Vulnerability (weapon) %', 'weaponVulnPct'], ['Vulnerability (status) %', 'statusVulnPct'], ['All DMG %', 'allDmgPct'],
      ['Psi Intensity', 'psiIntensity'], ['Psi Intensity %', 'psiIntensityPct'], ['Fire Rate %', 'fireRatePct'], ['Reload Efficiency %', 'reloadEfficiencyPct'], ['Magazine %', 'magazinePct'], ['Max HP', 'maxHp'], ['Max HP %', 'maxHpPct'], ['DMG Reduction %', 'dmgReductionPct'],
    ];
    for (const [label, stat] of groups) {
      const src = r.sources[stat];
      if (!src || !src.length) continue;
      const total = r.totals[stat];
      const totalText = typeof total === 'object' ? Object.entries(total).map(([k, v]) => `${k === 'all' ? '' : prettyKey(k) + ' '}${fmt.signed(v, 1)}`).join(', ') : fmt.signed(total, 1);
      const det = h('details.breakdown', h('summary', `${label}: ${totalText}`));
      const g = h('div.bucket');
      for (const s of src) g.append(h('span.src', `${s.source}${s.key && s.key !== 'all' ? ' (' + prettyKey(s.key) + ')' : ''}`), h('span.v', fmt.signed(s.value, 1)));
      det.append(g);
      box.append(det);
    }
    return h('div.panel', h('header', h('h2', 'Stat breakdown')), box);
  }

  function formulaText(r) {
    const m = r.multipliers;
    const lines = [
      `hit = ${fmt.num(r.attack.atStar)} (card, ${r.inputs.star}★)`,
      `    × ${m.attackMult.toFixed(3)} (1 + Attack ${fmt.pct(r.attack.pct, 1)})`,
      `    × ${m.weaponDmgMult.toFixed(3)} (1 + Weapon DMG ${fmt.pct(m.weaponDmgPct, 1)})`,
      m.elementalApplied ? `    × ${(1 + m.elementalPct / 100).toFixed(3)} (1 + Elemental ${fmt.pct(m.elementalPct, 1)})` : null,
      `    × ${(1 + m.dmgVsPct / 100).toFixed(3)} (1 + DMG vs type ${fmt.pct(m.dmgVsPct, 1)})`,
      `    × ${(1 + m.weaponVulnPct / 100).toFixed(3)} (1 + Vulnerability ${fmt.pct(m.weaponVulnPct, 1)})`,
      `    × ${(1 + m.allDmgPct / 100).toFixed(3)} (1 + All DMG ${fmt.pct(m.allDmgPct, 1)})`,
      m.mitigation !== 1 ? `    × ${m.mitigation.toFixed(2)} (damage taken)` : null,
      `    = ${fmt.num(r.hits.normal, 1)} body hit`,
      `crit      × ${m.critMult.toFixed(3)}   weakspot × ${m.weakMult.toFixed(3)}   weakspot crit × ${m.critWeakMult.toFixed(3)}`,
      r.status && r.status.perProc != null ? (r.status.model === 'psi'
        ? `proc = Psi ${fmt.num(r.psi.effective)} × ${(r.status.factor * 100).toFixed(0)}% × (1 + Status/keyword ${fmt.pct(r.psi.statusDmgPct + (r.totals.keywordDmgPct ? ((r.totals.keywordDmgPct.all || 0) + (r.totals.keywordDmgPct[r.status.keyword] || 0)) : 0), 1)}) × elemental × final × vuln = ${fmt.num(r.status.perProc, 1)}`
        : `proc = hit × ${(r.status.factor * 100).toFixed(0)}% × (1 + ${prettyKey(r.status.keyword)} DMG) = ${fmt.num(r.status.perProc, 1)} (crit/weakspot apply)`) : null,
    ].filter(Boolean);
    return lines.join('\n');
  }

  boot();
})();

</script>
