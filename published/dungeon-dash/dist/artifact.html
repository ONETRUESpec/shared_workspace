  // =====================================================================================
  // pure formulas
  // =====================================================================================
  function biomeForFloor(f) {
    const i = Math.floor((floorOf(f) - 1) / 10) % BIOMES.length;
    return BIOMES[i];
  }

  // Extra enemy HP & ATK multiplier on a floor: biomeStep per biome passed (floors 11, 21, …)
  // times every BALANCE.enemy.walls step [fromFloor, mult] already reached. These are the walls.
  function wallMult(floor) {
    const E = BALANCE.enemy;
    const f = floorOf(floor);
    let m = Math.pow(num(E.biomeStep, 1), Math.floor((f - 1) / 10));
    if (Array.isArray(E.walls)) {
      for (const w of E.walls) if (Array.isArray(w) && f >= w[0]) m *= num(w[1], 1);
    }
    return m;
  }

  function enemyStats(floor, typeId, opts) {
    const E = BALANCE.enemy;
    const f = floorOf(floor);
    const def = ENEMIES[typeId] || ENEMIES.skeleton;
    const isBoss = opts && typeof opts.isBoss === 'boolean' ? opts.isBoss : def.boss;
    const hpMult = num(def.hpMult, 1);
    const atkMult = num(def.atkMult, 1);
    const wall = wallMult(f);
    const hp =E.hpBase * hpMult * Math.pow(E.hpGrowth, f - 1) * wall * (isBoss ? E.bossHp : 1);
    const atk = E.atkBase * atkMult * Math.pow(E.atkGrowth, f - 1) * Math.pow(wall, num(E.wallAtkExp, 1)) * (isBoss ? E.bossAtk : 1);
    const gold = E.goldBase * Math.pow(E.goldGrowth, f - 1) * (isBoss ? E.bossGold : 1);
    const xp = E.xpBase * Math.pow(E.xpGrowth, f - 1) * (isBoss ? E.bossXp : 1);
    return {
      hp: Math.max(1, Math.round(big(hp, 1))),
      atk: Math.max(1, Math.round(big(atk, 1))),
      atkSpeed: Math.max(0.05, num(def.atkSpeed, 0.8)),
      gold: Math.max(1, Math.round(big(gold, 1))),
      xp: Math.max(1, Math.round(big(xp, 1))),
    };
  }

  // Gold of one normal kill on a floor (before gold bonus).
  function killGold(floor) {
    return enemyStats(floor, 'skeleton', { isBoss: false }).gold;
  }

  function waveComposition(floor, wave) {
    const W = BALANCE.waves;
    const f = floorOf(floor);
    const w = clampNum(toInt(wave, 1), 1, WAVES_PER_FLOOR);
    const biome = biomeForFloor(f);
    const rnd = seeded(f * 7919 + w * 104729 + 13);
    const weights = biome.enemies.map((t) => num(ENEMIES[t] && ENEMIES[t].weight, 1));
    const pickNormal = () => biome.enemies[weightedPick(weights, rnd)];
    const out = [];
    if (w >= WAVES_PER_FLOOR) {
      out.push(biome.boss);
      let adds = 0;
      for (const row of W.bossAdds) if (f >= row[0]) adds = row[1];
      // Minions beside the boss come from the biome's lighter enemies (no tanks), so the boss
      // fight's difficulty follows the floor curve instead of jumping with the seeded roll.
      let pool = biome.enemies.filter((t) => num(ENEMIES[t] && ENEMIES[t].hpMult, 1) <= num(W.bossAddMaxHp, 99));
      if (!pool.length) pool = biome.enemies;
      const addWeights = pool.map((t) => num(ENEMIES[t] && ENEMIES[t].weight, 1));
      for (let i = 0; i < adds; i++) out.push(pool[weightedPick(addWeights, rnd)]);
      return out;
    }
    const count = clampNum(
      W.baseCount + Math.floor((w - 1) / 2) * W.perTwoWaves + Math.min(W.floorBonusMax, Math.floor((f - 1) / W.floorStep)),
      W.minCount,
      W.maxCount,
    );
    for (let i = 0; i < count; i++) out.push(pickNormal());
    return out;
  }

  function heroBaseStats(level) {
    const H = BALANCE.hero;
    const L = clampNum(toInt(level, 1), 1, 100000);
    const g = Math.pow(H.growth, L - 1);
    return { atk: num(H.atk * g, H.atk), hp: num(H.hp * g, H.hp) };
  }

  function xpToNext(level) {
    const L = clampNum(toInt(level, 1), 1, 100000);
    const v = Math.floor(BALANCE.xp.base * Math.pow(BALANCE.xp.growth, L - 1));
    return isNum(v) ? Math.max(1, v) : Number.MAX_SAFE_INTEGER;
  }

  function rarityOdds(chestLevel) {
    const rows = BALANCE.chest.oddsBp;
    const L = clampNum(toInt(chestLevel, 1), 1, rows.length);
    const row = rows[L - 1];
    // row = [common, rare, epic, legendary, mythic, celestial]; uncommon = remainder.
    const bp = [row[0], 0, row[1], row[2], row[3], row[4], row[5]];
    const rest = 10000 - bp.reduce((a, b) => a + b, 0);
    bp[1] = Math.max(0, rest);
    const total = bp.reduce((a, b) => a + b, 0) || 10000;
    return bp.map((v) => v / total);
  }

  function premiumOdds(chestLevel) {
    const C = BALANCE.chest;
    const base = rarityOdds(toInt(chestLevel, 1) + C.premiumLevelBonus);
    const out = base.map((p, i) => (i < C.premiumMinRarity ? 0 : p));
    const total = out.reduce((a, b) => a + b, 0);
    if (total <= 0) return out.map((_, i) => (i === C.premiumMinRarity ? 1 : 0));
    return out.map((p) => p / total);
  }

  function chestUpgradeCost(level) {
    const L = clampNum(toInt(level, 1), 1, MAX_CHEST_LEVEL);
    return Math.floor(BALANCE.chest.costBase * Math.pow(BALANCE.chest.costGrowth, L - 1));
  }

  function itemIlvl(highestFloor) {
    const s = BALANCE.item.ilvlSpread;
    const v = floorOf(highestFloor) + DD.randInt(s[0], s[1]);
    return clampNum(v, 1, BALANCE.enemy.maxFloor);
  }

  function premiumIlvl(highestFloor) {
    const s = BALANCE.item.premiumIlvlSpread;
    return clampNum(floorOf(highestFloor) + DD.randInt(s[0], s[1]), 1, BALANCE.enemy.maxFloor);
  }

  function eraForIlvl(ilvl) {
    const v = Math.max(1, toInt(ilvl, 1));
    let e = 0;
    for (let i = 0; i < ERAS.length; i++) if (v >= ERAS[i].from) e = i;
    return e;
  }

  function itemMainValue(slot, rarity, ilvl) {
    const I = BALANCE.item;
    const info = SLOT_INFO[slot] || SLOT_INFO.weapon;
    const r = RARITIES[clampNum(toInt(rarity, 0), 0, 6)];
    const lv = clampNum(toInt(ilvl, 1), 1, BALANCE.enemy.maxFloor);
    const base = info.stat === 'atk' ? I.baseAtk : I.baseHp;
    return base * info.mult * r.mult * Math.pow(I.growth, lv - 1);
  }

  function rollSubValue(stat, rarity) {
    const range = BALANCE.subRanges[stat] || [0.01, 0.02];
    const r = RARITIES[clampNum(toInt(rarity, 0), 0, 6)];
    const v = DD.rand(range[0], range[1]) * (1 + BALANCE.item.subRarityScale * r.idx) * r.rollMult;
    return Math.max(0.00001, round5(v));
  }

  function rollSubs(slot, rarity) {
    const r = RARITIES[clampNum(toInt(rarity, 0), 0, 6)];
    const poolObj = BALANCE.subPools[slot] || {};
    let keys = Object.keys(poolObj).filter((k) => SUBSTATS.indexOf(k) >= 0);
    if (keys.length < r.subs) keys = SUBSTATS.slice(); // safety: fall back to the full list
    const weights = keys.map((k) => num(poolObj[k], 1));
    const subs = [];
    for (let n = 0; n < r.subs && keys.length; n++) {
      const i = DD.weightedIndex(weights);
      subs.push({ stat: keys[i], value: rollSubValue(keys[i], r.idx) });
      keys.splice(i, 1);
      weights.splice(i, 1);
    }
    // Keep a stable, readable order.
    subs.sort((a, b) => SUBSTATS.indexOf(a.stat) - SUBSTATS.indexOf(b.stat));
    return subs;
  }

  function itemName(slot, era, rarity) {
    const byEra = ITEM_NAMES[slot] || ITEM_NAMES.weapon;
    const list = byEra[clampNum(toInt(era, 0), 0, byEra.length - 1)];
    let name = DD.pick(list);
    const ep = EPITHETS[rarity];
    if (ep) name = DD.pick(ep) + ' ' + name;
    return name;
  }

  // Deterministic item factory (used for the starter weapon and by rollItem).
  // opts: { slot, rarity, ilvl, name?, mainRoll? (multiplier, default random ±mainSpread), subs? }
  function createItem(opts) {
    const o = opts || {};
    const slot = SLOT_INFO[o.slot] ? o.slot : 'weapon';
    const rarity = clampNum(toInt(o.rarity, 0), 0, 6);
    const ilvl = clampNum(toInt(o.ilvl, 1), 1, BALANCE.enemy.maxFloor);
    const era = eraForIlvl(ilvl);
    const spread = BALANCE.item.mainSpread;
    const roll = isNum(o.mainRoll) ? o.mainRoll : 1 + DD.rand(-spread, spread);
    const value = Math.max(1, Math.round(itemMainValue(slot, rarity, ilvl) * roll));
    return {
      id: DD.uid('it'),
      slot,
      rarity,
      ilvl,
      era,
      name: typeof o.name === 'string' && o.name ? o.name : itemName(slot, era, rarity),
      main: { stat: SLOT_INFO[slot].stat, value },
      subs: Array.isArray(o.subs) ? o.subs.map((x) => ({ stat: x.stat, value: x.value })) : rollSubs(slot, rarity),
    };
  }

  // rollItem({ ilvl, chestLevel, premium, slot?, rarity? }) → Item
  function rollItem(opts) {
    const o = opts || {};
    const chestLevel = clampNum(toInt(o.chestLevel, 1), 1, MAX_CHEST_LEVEL);
    const odds = o.premium ? premiumOdds(chestLevel) : rarityOdds(chestLevel);
    const rarity = isNum(o.rarity) ? clampNum(Math.floor(o.rarity), 0, 6) : DD.weightedIndex(odds);
    const slot = SLOT_INFO[o.slot] ? o.slot : DD.pick(SLOTS);
    return createItem({ slot, rarity, ilvl: toInt(o.ilvl, 1) });
  }

  function itemSellValue(item) {
    if (!item || typeof item !== 'object') return 0;
    const ilvl = clampNum(toInt(item.ilvl, 1), 1, BALANCE.enemy.maxFloor);
    const r = clampNum(toInt(item.rarity, 0), 0, 6);
    const v = Math.floor(BALANCE.sell.base * Math.pow(BALANCE.sell.growth, ilvl - 1) * Math.pow(1 + r, 2));
    return isNum(v) ? Math.max(1, v) : 1;
  }

  function calcPower(stats) {
    const st = stats || {};
    const P = BALANCE.power;
    const g = (k, d) => (isNum(st[k]) ? st[k] : d);
    const atk = Math.max(0, g('atk', 0));
    const hp = Math.max(0, g('hp', 0));
    const critChance = clampNum(g('critChance', 0), 0, 1);
    const critDmg = Math.max(1, g('critDmg', 1.5));
    const atkSpeed = Math.max(0.1, g('atkSpeed', 1));
    const util =
      1 +
      P.combo * Math.max(0, g('combo', 0)) +
      P.counter * Math.max(0, g('counter', 0)) +
      P.dodge * Math.max(0, g('dodge', 0)) +
      P.stun * Math.max(0, g('stun', 0)) +
      P.lifesteal * Math.max(0, g('lifesteal', 0)) +
      P.regen * Math.max(0, g('regen', 0)) +
      P.skillDmg * Math.max(0, g('skillDmg', 0)) +
      P.bossDmg * Math.max(0, g('bossDmg', 0));
    const extra = 1 + P.skillLevel * Math.max(0, g('skillLevels', 0)) + P.allyLevel * Math.max(0, g('allyLevels', 0));
    const v = (atk + P.hpWeight * hp) * (1 + critChance * (critDmg - 1)) * atkSpeed * util * extra;
    return isNum(v) ? Math.round(v) : 0;
  }

  // ---- skills -------------------------------------------------------------------------
  function skillLevelOf(level) {
    return clampNum(toInt(level, 1), 1, BALANCE.skillUpgrade.maxLevel);
  }
  function skillParams(id, level) {
    const B = BALANCE.skills[id];
    if (!B) return { cd: 10 };
    const L = skillLevelOf(level);
    const k = L - 1;
    switch (id) {
      case 'bomb':
        return { cd: B.cd, dmg: B.dmg + B.dmgPerLv * k };
      case 'blades':
        return { cd: B.cd, dmg: B.dmg + B.dmgPerLv * k, duration: B.duration, tick: B.tick, radius: B.radius };
      case 'warcry':
        return { cd: B.cd, duration: B.duration, buffAtk: B.buffAtk + B.buffAtkPerLv * k, buffSpd: B.buffSpd };
      case 'heal':
        return { cd: B.cd, heal: B.heal + B.healPerLv * k };
      case 'lightning':
        return { cd: B.cd, dmg: B.dmg + B.dmgPerLv * k, targets: B.targets + Math.floor(L / B.targetsEvery) };
      case 'shield':
        return { cd: B.cd, shield: B.shield + B.shieldPerLv * k, duration: B.duration };
      case 'frost':
        return { cd: B.cd, dmg: B.dmg + B.dmgPerLv * k, freeze: B.freeze + B.freezePerLv * k };
      case 'meteor':
        return { cd: B.cd, dmg: B.dmg + B.dmgPerLv * k, stun: B.stun };
      default:
        return { cd: B.cd };
    }
  }
  function skillDesc(id, level) {
    const p = skillParams(id, level);
    switch (id) {
      case 'bomb':
        return 'Hurl a fire bomb that blasts all enemies for ' + pct(p.dmg) + ' ATK.';
      case 'blades':
        return 'Spinning blades for ' + secs(p.duration) + ': every ' + secs(p.tick) + ' hit enemies within ' + p.radius + 'px for ' + pct(p.dmg) + ' ATK.';
      case 'warcry':
        return 'Roar for +' + pct(p.buffAtk) + ' ATK and +' + pct(p.buffSpd) + ' attack speed for ' + secs(p.duration) + '.';
      case 'heal':
        return 'Restore ' + pct(p.heal) + ' of max HP.';
      case 'lightning':
        return 'Lightning arcs through up to ' + p.targets + ' enemies for ' + pct(p.dmg) + ' ATK each.';
      case 'shield':
        return 'Gain a shield absorbing ' + pct(p.shield) + ' of max HP for ' + secs(p.duration) + '.';
      case 'frost':
        return 'Frost nova deals ' + pct(p.dmg) + ' ATK to all enemies and freezes them for ' + secs(p.freeze) + '.';
      case 'meteor':
        return 'A meteor crashes down for ' + pct(p.dmg) + ' ATK to all enemies and stuns them for ' + secs(p.stun) + '.';
      default:
        return '';
    }
  }
  function skillUpgradeCost(level) {
    const U = BALANCE.skillUpgrade;
    const L = clampNum(toInt(level, 1), 1, U.maxLevel);
    return Math.ceil(U.base + L * U.perLevel);
  }

  // ---- allies -------------------------------------------------------------------------
  function allyParams(id, level) {
    const B = BALANCE.allies[id];
    if (!B) return { interval: 2 };
    const L = clampNum(toInt(level, 1), 1, BALANCE.allyUpgrade.maxLevel);
    const k = L - 1;
    const out = { interval: B.interval };
    if (isNum(B.dmg)) out.dmg = B.dmg + B.dmgPerLv * k;
    if (isNum(B.heal)) out.heal = B.heal + B.healPerLv * k;
    if (isNum(B.radius)) out.radius = B.radius;
    return out;
  }
  function allyDesc(id, level) {
    const p = allyParams(id, level);
    switch (id) {
      case 'wolf':
        return 'Bites the nearest enemy every ' + secs(p.interval) + ' for ' + pct(p.dmg) + ' of your ATK.';
      case 'fairy':
        return 'Heals you for ' + pct(p.heal) + ' of max HP every ' + secs(p.interval) + '.';
      case 'drone_ally':
        return 'Shoots the nearest enemy every ' + secs(p.interval) + ' for ' + pct(p.dmg) + ' of your ATK.';
      case 'golem_ally':
        return 'Slams all enemies within ' + p.radius + 'px every ' + secs(p.interval) + ' for ' + pct(p.dmg) + ' of your ATK.';
      default:
        return '';
    }
  }
  function allyUpgradeCost(level) {
    const U = BALANCE.allyUpgrade;
    const L = clampNum(toInt(level, 1), 1, U.maxLevel);
    return Math.floor(U.base * Math.pow(U.growth, L - 1));
  }

  // ---- mastery ------------------------------------------------------------------------
  function masteryBonus(id, level) {
    const B = BALANCE.mastery[id];
    if (!B) return 0;
    const L = clampNum(toInt(level, 0), 0, B.max);
    return B.per * L;
  }
  function masteryCost(id, level) {
    const B = BALANCE.mastery[id];
    if (!B) return Infinity;
    const L = clampNum(toInt(level, 0), 0, B.max);
    if (L >= B.max) return Infinity;
    return B.costBase + B.costPerLv * L;
  }
  function masteryDesc(id, level) {
    const v = masteryBonus(id, level);
    switch (id) {
      case 'might':
        return '+' + pct(v) + ' ATK';
      case 'vitality':
        return '+' + pct(v) + ' max HP';
      case 'greed':
        return '+' + pct(v) + ' gold';
      case 'fortune':
        return '+' + pct(v) + ' chest drop chance';
      case 'precision':
        return '+' + pct(v) + ' crit damage';
      case 'patience': {
        const h = Math.round(v);
        return '+' + h + 'h offline time (' + (BALANCE.income.offlineBaseHours + h) + 'h max)';
      }
      default:
        return '';
    }
  }

  // ---- dungeons -----------------------------------------------------------------------
  function dungeonFloor(level) {
    const D = BALANCE.dungeons;
    return D.floorBase + Math.max(1, toInt(level, 1)) * D.floorPerLevel;
  }
  // Gold earned per second at a floor at the reference kill rate (before gold bonus).
  function goldIncomeRate(floor) {
    return BALANCE.income.refKillsPerSec * killGold(floor);
  }
  function dungeonRewards(id, level) {
    const D = BALANCE.dungeons;
    const L = Math.max(1, toInt(level, 1));
    switch (id) {
      case 'dragon':
        return { scrolls: D.dragonScrolls[0] + D.dragonScrolls[1] * L };
      case 'horde':
        return { gems: D.hordeGems[0] + D.hordeGems[1] * L };
      case 'vault':
        return { premiumChests: D.vaultChests[0] + Math.floor(L * D.vaultChests[1]) };
      case 'mothership':
        return {
          gold: Math.max(1, Math.round(D.mothershipGoldSeconds * goldIncomeRate(dungeonFloor(L) + num(D.mothershipGoldFloors, 0)))),
          scrolls: D.mothershipScrolls[0] + D.mothershipScrolls[1] * L,
        };
      default:
        return {};
    }
  }
  function dungeonDesc(id) {
    const d = DUNGEONS[id];
    if (!d) return '';
    const t = BALANCE.dungeons.time;
    switch (id) {
      case 'dragon':
        return 'Slay the Ancient Dragon within ' + t + 's. Rewards Skill Scrolls.';
      case 'horde':
        return 'Cut down ' + BALANCE.dungeons.hordeTarget + ' zombies within ' + t + 's. Rewards Gems.';
      case 'vault':
        return 'Shatter the Stone Golem within ' + t + 's. Rewards Premium Chests (Rare or better).';
      case 'mothership':
        return 'Take down the Alien Overlord within ' + t + 's. Rewards a hoard of Gold and Skill Scrolls.';
      default:
        return '';
    }
  }

  // ---- rewards ------------------------------------------------------------------------
  // Base floor-clear rewards (state applies the gold bonus).
  function floorClearRewards(floor) {
    const F = BALANCE.floorClear;
    const f = floorOf(floor);
    const gems = f % 10 === 0 ? F.gemsEvery10 : f % 5 === 0 ? F.gemsEvery5 : num(F.gems, 0);
    return { chests: F.chests, gold: Math.max(1, Math.round(F.goldKills * killGold(f))), gems };
  }

  function rewardText(r) {
    if (!r || typeof r !== 'object') return '';
    const parts = [];
    const add = (n, one, many) => {
      if (isNum(n) && n > 0) parts.push('+' + DD.fmt(n) + ' ' + (n === 1 ? one : many));
    };
    add(r.gold, 'Gold', 'Gold');
    add(r.gems, 'Gem', 'Gems');
    add(r.chests, 'Chest', 'Chests');
    add(r.premiumChests, 'Premium Chest', 'Premium Chests');
    add(r.scrolls, 'Skill Scroll', 'Skill Scrolls');
    add(r.keys, 'Key', 'Keys');
    add(r.key, 'Key', 'Keys');
    add(r.xp, 'XP', 'XP');
    return parts.join(', ');
  }

  // ---- quests -------------------------------------------------------------------------
  function questAt(index) {
    const i = Math.max(0, toInt(index, 0));
    if (i < QUESTS.length) {
      const q = QUESTS[i];
      return { id: q.id, text: q.text, type: q.type, key: q.key, target: q.target, reward: Object.assign({}, q.reward) };
    }
    const k = i - QUESTS.length;
    const floor = ENDLESS_FIRST_FLOOR + ENDLESS_STEP * k;
    const reward = { gems: Math.min(200, 40 + 5 * k) };
    if (k % 2 === 1) reward.chests = 10 + 2 * Math.floor(k / 2);
    if (k % 2 === 0) reward.scrolls = 6 + Math.floor(k / 2);
    if (k % 4 === 3) reward.keys = 1;
    return { id: 'floor_' + floor, text: 'Reach floor ' + floor, type: 'floor', target: floor, reward };
  }

  // ---- stat formatting ----------------------------------------------------------------
  function fmtStat(stat, value) {
    const info = STAT_INFO[stat];
    const v = isNum(value) ? value : 0;
    if (!info || info.fmt === 'num') return DD.fmt(v);
    const digits = Math.abs(v) < 0.01 ? 2 : 1;
    return (v >= 0 ? '+' : '') + DD.fmtPct(v, digits) + (info.suffix || '');
  }

  // =====================================================================================
  // export
  // =====================================================================================
  DD.data = {
    BALANCE,
    RARITIES,
    SLOTS,
    SLOT_INFO,
    ERAS,
    SUBSTATS,
    SUBSTAT_INFO,
    STAT_INFO,
    ITEM_NAMES,
    EPITHETS,
    BIOMES,
    ENEMIES,
    PROJECTILES,
    SKILLS,
    SKILL_IDS,
    ALLIES,
    ALLY_IDS,
    MASTERY,
    MASTERY_IDS,
    DUNGEONS,
    DUNGEON_IDS,
    QUESTS,
    WAVES_PER_FLOOR,
    BOSS_TIME,
    DUNGEON_TIME,
    MAX_CHEST_LEVEL,
    get MAX_KEYS() {
      return BALANCE.keys.max;
    },
    get KEY_REGEN_MS() {
      return BALANCE.keys.regenMs;
    },
    get SKILL_SLOT_FLOORS() {
      return BALANCE.skillSlotFloors.slice();
    },
    get ALLY_SLOT_FLOORS() {
      return BALANCE.allySlotFloors.slice();
    },
    get MAX_SKILL_LEVEL() {
      return BALANCE.skillUpgrade.maxLevel;
    },
    get MAX_ALLY_LEVEL() {
      return BALANCE.allyUpgrade.maxLevel;
    },

    biomeForFloor,
    wallMult,
    enemyStats,
    killGold,
    waveComposition,
    heroBaseStats,
    xpToNext,
    rollItem,
    createItem,
    itemIlvl,
    premiumIlvl,
    eraForIlvl,
    itemMainValue,
    itemName,
    rarityOdds,
    premiumOdds,
    chestUpgradeCost,
    itemSellValue,
    calcPower,
    skillParams,
    skillDesc,
    skillUpgradeCost,
    allyParams,
    allyDesc,
    allyUpgradeCost,
    masteryBonus,
    masteryCost,
    masteryDesc,
    dungeonFloor,
    dungeonRewards,
    dungeonDesc,
    goldIncomeRate,
    floorClearRewards,
    rewardText,
    questAt,
    fmtStat,
  };
})(globalThis.DD);

</script>
<script>
/* Dungeon Dash — state: persistent save, economy actions, offline rewards and quests.
 *
 * DD.state.s is the single persistent save object (see CONTRACT §4). Every mutation emits
 * 'state:changed'; anything that can change hero stats also emits 'stats:changed'.
 * Works in browsers and in Node (persistence is skipped when localStorage is unavailable). */
(function (DD) {
  'use strict';

  const SAVE_KEY = 'dungeon-dash-save-v1';
  const BACKUP_KEY = 'dungeon-dash-save-v1-backup';
  const CURRENCIES = ['gold', 'gems', 'scrolls', 'keys'];
  const CURRENCY_NAMES = { gold: 'gold', gems: 'gems', scrolls: 'Skill Scrolls', keys: 'keys' };
  const MAX_CLAIMED_IDS = 60;
  const MAX_SAVE_LENGTH = 2000000;

  const D = () => DD.data; // lazy: never touch other modules at load time
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const num = (v, d) => (isNum(v) ? v : d);
  const clampNum = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const toInt = (v, d) => (isNum(v) ? Math.floor(v) : d);
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const emit = (evt, payload) => DD.bus.emit(evt, payload);
  const toast = (text, kind) => emit('toast', { text, kind: kind || 'info' });

  // ------------------------------------------------------------------ runtime (not saved)
  let _s = null;
  let statsCache = null;
  let autoOpenTimer = 0;
  let autosaveTimer = 0;
  let questReadyIndex = -1;
  let checkingQuest = false;

  const api = {};

  Object.defineProperty(api, 's', {
    enumerable: true,
    configurable: true,
    get() {
      if (!_s) _s = newGame(Date.now());
      return _s;
    },
    set(v) {
      if (isObj(v)) {
        _s = sanitizeState(v);
        resetRuntime();
        statsCache = null;
      }
    },
  });

  // ------------------------------------------------------------------ new game / defaults
  function defaultState(now) {
    const data = D();
    const B = data.BALANCE;
    const equipped = {};
    for (const slot of data.SLOTS) equipped[slot] = null;
    const mastery = {};
    for (const id of data.MASTERY_IDS) mastery[id] = 0;
    const dungeons = {};
    for (const id of data.DUNGEON_IDS) dungeons[id] = { level: 1 };
    return {
      version: 1,
      createdAt: now,
      lastSeen: now,
      hero: { level: 1, xp: 0 },
      gold: B.start.gold,
      gems: B.start.gems,
      keys: B.start.keys,
      scrolls: B.start.scrolls,
      chests: B.start.chests,
      premiumChests: 0,
      chestLevel: 1,
      equipped,
      pendingItem: null,
      campaign: { floor: 1, wave: 1, highestFloor: 1, farming: false },
      skills: { owned: { bomb: 1 }, equipped: ['bomb', null, null, null] },
      allies: { owned: {}, equipped: [null, null] },
      mastery,
      dungeons,
      keyRegenAt: B.start.keys < data.MAX_KEYS ? now + data.KEY_REGEN_MS : 0,
      quest: { index: 0, claimedIds: [] },
      stats: {
        kills: 0,
        bossKills: 0,
        chestsOpened: 0,
        itemsSold: 0,
        itemsEquipped: 0,
        flyingChests: 0,
        dungeonsWon: 0,
        deaths: 0,
        playTime: 0,
        goldEarned: 0,
        bestItemRarity: -1,
        autoOpenUsed: 0,
      },
      settings: {
        sound: true,
        speed: 1,
        autoSkill: true,
        autoBoss: true,
        autoLoot: { sell: [true, true, false, false, false, false, false], autoEquip: true, stopRarity: 4 },
      },
      autoOpen: false,
    };
  }

  function starterWeapon() {
    return D().createItem({ slot: 'weapon', rarity: 0, ilvl: 1, name: 'Rusty Sword', mainRoll: 1, subs: [] });
  }

  function newGame(now) {
    const s = defaultState(now);
    s.equipped.weapon = starterWeapon();
    return s;
  }

  function resetRuntime() {
    autoOpenTimer = 0;
    autosaveTimer = 0;
    questReadyIndex = -1;
  }

  // ------------------------------------------------------------------ change notification
  function changed() {
    // Recomputing hero stats is cheap; dropping the memo on every mutation also covers code
    // (sims, tests) that pokes DD.state.s directly before calling any API function.
    statsCache = null;
    emit('state:changed', {});
    checkQuestReady();
  }

  function statsDirty() {
    statsCache = null;
    emit('stats:changed', {});
  }

  // For external code that edited DD.state.s directly: drop caches and notify listeners.
  function invalidate() {
    statsDirty();
    changed();
  }

  // ------------------------------------------------------------------ validation
  // Deep-merge `src` onto `def`, keeping only keys present in `def` and only values whose type
  // matches the default. Arrays and nulls are handled by the caller.
  function mergeShape(def, src) {
    if (Array.isArray(def)) return def.slice();
    if (def === null) return null;
    if (isObj(def)) {
      const out = {};
      const so = isObj(src) ? src : {};
      for (const k of Object.keys(def)) out[k] = mergeShape(def[k], so[k]);
      return out;
    }
    if (typeof def === 'number') return isNum(src) ? src : def;
    if (typeof def === 'boolean') return typeof src === 'boolean' ? src : def;
    if (typeof def === 'string') return typeof src === 'string' ? src : def;
    return def;
  }

  function sanitizeItem(raw, slotHint) {
    if (!isObj(raw)) return null;
    const data = D();
    const slot = typeof raw.slot === 'string' && data.SLOT_INFO[raw.slot] ? raw.slot : null;
    if (!slot || (slotHint && slot !== slotHint)) return null;
    const maxIlvl = data.BALANCE.enemy.maxFloor;
    const rarity = isNum(raw.rarity) ? clampNum(Math.floor(raw.rarity), 0, data.RARITIES.length - 1) : 0;
    const ilvl = isNum(raw.ilvl) ? clampNum(Math.floor(raw.ilvl), 1, maxIlvl) : 1;
    const era = isNum(raw.era) ? clampNum(Math.floor(raw.era), 0, data.ERAS.length - 1) : data.eraForIlvl(ilvl);
    const mainStat = data.SLOT_INFO[slot].stat;
    const mainVal =
      isObj(raw.main) && isNum(raw.main.value) && raw.main.value > 0
        ? raw.main.value
        : Math.max(1, Math.round(data.itemMainValue(slot, rarity, ilvl)));
    const subs = [];
    const seen = {};
    if (Array.isArray(raw.subs)) {
      for (const x of raw.subs) {
        if (subs.length >= 5) break;
        if (!isObj(x) || typeof x.stat !== 'string' || data.SUBSTATS.indexOf(x.stat) < 0 || seen[x.stat]) continue;
        if (!isNum(x.value) || x.value < 0) continue;
        seen[x.stat] = true;
        subs.push({ stat: x.stat, value: Math.min(x.value, 10) });
      }
    }
    const name =
      typeof raw.name === 'string' && raw.name.trim() ? raw.name.trim().slice(0, 60) : data.itemName(slot, era, rarity);
    const id = typeof raw.id === 'string' && raw.id ? raw.id.slice(0, 48) : DD.uid('it');
    return { id, slot, rarity, ilvl, era, name, main: { stat: mainStat, value: mainVal }, subs };
  }

  function sanitizeState(raw) {
    const data = D();
    const now = Date.now();
    const out = mergeShape(defaultState(now), raw);
    const maxFloor = data.BALANCE.enemy.maxFloor;

    out.version = 1;
    if (!(out.createdAt > 0) || out.createdAt > now + 864e5) out.createdAt = now;
    if (!(out.lastSeen > 0) || out.lastSeen > now + 864e5) out.lastSeen = now;

    out.hero.level = clampNum(toInt(out.hero.level, 1), 1, 100000);
    out.hero.xp = Math.max(0, num(out.hero.xp, 0));
    for (const c of ['gold', 'gems', 'keys', 'scrolls', 'chests', 'premiumChests']) {
      out[c] = Math.max(0, Math.floor(num(out[c], 0)));
    }
    out.chestLevel = clampNum(toInt(out.chestLevel, 1), 1, data.MAX_CHEST_LEVEL);

    // gear
    const rawEq = raw.equipped;
    for (const slot of data.SLOTS) out.equipped[slot] = isObj(rawEq) ? sanitizeItem(rawEq[slot], slot) : null;
    if (!isObj(rawEq)) out.equipped.weapon = starterWeapon();
    out.pendingItem = sanitizeItem(raw.pendingItem);

    // campaign
    const c = out.campaign;
    c.floor = clampNum(toInt(c.floor, 1), 1, maxFloor);
    c.wave = clampNum(toInt(c.wave, 1), 1, data.WAVES_PER_FLOOR);
    c.highestFloor = clampNum(Math.max(toInt(c.highestFloor, 1), c.floor), 1, maxFloor);
    c.farming = !!c.farming;

    // skills
    const rawSkills = isObj(raw.skills) ? raw.skills : {};
    const sOwned = {};
    const rawSOwned = isObj(rawSkills.owned) ? rawSkills.owned : {};
    for (const id of data.SKILL_IDS) {
      if (isNum(rawSOwned[id]) && rawSOwned[id] >= 1) sOwned[id] = clampNum(Math.floor(rawSOwned[id]), 1, data.MAX_SKILL_LEVEL);
    }
    if (!sOwned.bomb) sOwned.bomb = 1;
    out.skills.owned = sOwned;
    const skillSlots = slotsFor(data.SKILL_SLOT_FLOORS, c.highestFloor, 1);
    out.skills.equipped = cleanSlots(rawSkills.equipped, 4, sOwned, skillSlots);
    if (!Array.isArray(rawSkills.equipped)) out.skills.equipped[0] = 'bomb';

    // allies
    const rawAllies = isObj(raw.allies) ? raw.allies : {};
    const aOwned = {};
    const rawAOwned = isObj(rawAllies.owned) ? rawAllies.owned : {};
    for (const id of data.ALLY_IDS) {
      if (isNum(rawAOwned[id]) && rawAOwned[id] >= 1) aOwned[id] = clampNum(Math.floor(rawAOwned[id]), 1, data.MAX_ALLY_LEVEL);
    }
    out.allies.owned = aOwned;
    out.allies.equipped = cleanSlots(rawAllies.equipped, 2, aOwned, slotsFor(data.ALLY_SLOT_FLOORS, c.highestFloor, 0));

    // mastery & dungeons
    for (const id of data.MASTERY_IDS) {
      out.mastery[id] = clampNum(toInt(out.mastery[id], 0), 0, data.MASTERY[id].max);
    }
    for (const id of data.DUNGEON_IDS) {
      out.dungeons[id].level = clampNum(toInt(out.dungeons[id].level, 1), 1, 100000);
    }

    // keys
    out.keyRegenAt = Math.max(0, num(out.keyRegenAt, 0));
    fixKeyTimerOn(out, now);

    // quests
    out.quest.index = clampNum(toInt(out.quest.index, 0), 0, 1000000);
    const rawQuest = isObj(raw.quest) ? raw.quest : {};
    out.quest.claimedIds = Array.isArray(rawQuest.claimedIds)
      ? rawQuest.claimedIds.filter((x) => typeof x === 'string').slice(-MAX_CLAIMED_IDS)
      : [];

    // stats
    for (const k of Object.keys(out.stats)) {
      if (k === 'bestItemRarity') out.stats[k] = clampNum(toInt(out.stats[k], -1), -1, data.RARITIES.length - 1);
      else out.stats[k] = Math.max(0, num(out.stats[k], 0));
    }

    // settings
    const st = out.settings;
    st.speed = [1, 2, 3].indexOf(st.speed) >= 0 ? st.speed : 1;
    const rawSettings = isObj(raw.settings) ? raw.settings : {};
    const rawAL = isObj(rawSettings.autoLoot) ? rawSettings.autoLoot : {};
    const defSell = st.autoLoot.sell;
    st.autoLoot.sell = defSell.map((d, i) =>
      Array.isArray(rawAL.sell) && typeof rawAL.sell[i] === 'boolean' ? rawAL.sell[i] : d,
    );
    st.autoLoot.stopRarity = clampNum(toInt(st.autoLoot.stopRarity, 4), 0, data.RARITIES.length);
    out.autoOpen = !!out.autoOpen;
    return out;
  }

  function slotsFor(floors, highestFloor, min) {
    let n = 0;
    for (const f of floors) if (highestFloor >= f) n++;
    return Math.max(min, n);
  }

  function cleanSlots(rawArr, len, owned, unlocked) {
    const out = [];
    const used = {};
    for (let i = 0; i < len; i++) {
      const id = Array.isArray(rawArr) ? rawArr[i] : null;
      if (i < unlocked && typeof id === 'string' && owned[id] && !used[id]) {
        out.push(id);
        used[id] = true;
      } else out.push(null);
    }
    return out;
  }

  // ------------------------------------------------------------------ persistence
  function storage() {
    try {
      if (typeof localStorage !== 'undefined' && localStorage) return localStorage;
    } catch {
      /* storage blocked (sandboxed frame, privacy mode) */
    }
    return null;
  }

  function persist() {
    const st = storage();
    if (!st) return false;
    try {
      st.setItem(SAVE_KEY, serialize());
      return true;
    } catch {
      return false;
    }
  }

  function save() {
    api.s.lastSeen = Date.now();
    autosaveTimer = 0;
    return persist();
  }

  function startNew() {
    _s = newGame(Date.now());
    resetRuntime();
    statsDirty();
    changed();
  }

  function load() {
    const st = storage();
    let raw = null;
    if (st) {
      try {
        raw = st.getItem(SAVE_KEY);
      } catch {
        raw = null;
      }
    }
    if (typeof raw === 'string' && raw) {
      if (deserialize(raw)) return true;
      try {
        st.setItem(BACKUP_KEY, raw);
      } catch {
        /* ignore */
      }
    }
    startNew();
    return false;
  }

  function serialize() {
    try {
      return JSON.stringify(api.s);
    } catch {
      return '{}';
    }
  }

  function deserialize(str) {
    if (typeof str !== 'string' || !str || str.length > MAX_SAVE_LENGTH) return false;
    let raw;
    try {
      raw = JSON.parse(str);
    } catch {
      return false;
    }
    if (!isObj(raw)) return false;
    if (!isObj(raw.hero) && !isNum(raw.version)) return false; // not a Dungeon Dash save
    let next;
    try {
      next = sanitizeState(raw);
    } catch {
      return false;
    }
    _s = next;
    resetRuntime();
    statsDirty();
    changed();
    return true;
  }

  function reset() {
    const st = storage();
    if (st) {
      try {
        st.removeItem(SAVE_KEY);
      } catch {
        /* ignore */
      }
    }
    startNew();
    emit('state:reset', { reason: 'reset' });
  }

  function b64encode(str) {
    if (typeof TextEncoder !== 'undefined' && typeof btoa === 'function') {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      return btoa(bin);
    }
    if (typeof Buffer !== 'undefined') return Buffer.from(str, 'utf8').toString('base64');
    throw new Error('no base64 encoder');
  }

  function b64decode(code) {
    let clean = String(code).replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (!clean || !/^[A-Za-z0-9+/]*={0,2}$/.test(clean)) throw new Error('bad base64');
    while (clean.length % 4) clean += '=';
    if (typeof atob === 'function' && typeof TextDecoder !== 'undefined') {
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    }
    if (typeof Buffer !== 'undefined') return Buffer.from(clean, 'base64').toString('utf8');
    throw new Error('no base64 decoder');
  }

  function exportCode() {
    try {
      return b64encode(serialize());
    } catch {
      return '';
    }
  }

  function importCode(code) {
    if (typeof code !== 'string' || !code.trim()) {
      toast('Paste a save code first', 'bad');
      return false;
    }
    let json;
    try {
      json = b64decode(code.trim());
    } catch {
      toast('That save code is not valid', 'bad');
      return false;
    }
    if (!deserialize(json)) {
      toast('That save code is not valid', 'bad');
      return false;
    }
    save();
    toast('Save imported!', 'good');
    emit('state:reset', { reason: 'import' });
    return true;
  }

  // ------------------------------------------------------------------ hero stats
  function computeStats(equipped) {
    const data = D();
    const s = api.s;
    const B = data.BALANCE;
    const H = B.hero;
    const C = B.caps;
    const base = data.heroBaseStats(s.hero.level);
    let atkGear = 0;
    let hpGear = 0;
    const sub = {};
    for (const k of data.SUBSTATS) sub[k] = 0;
    for (const slot of data.SLOTS) {
      const it = equipped && equipped[slot];
      if (!it || !isObj(it.main)) continue;
      const v = Math.max(0, num(it.main.value, 0));
      if (it.main.stat === 'hp') hpGear += v;
      else atkGear += v;
      if (Array.isArray(it.subs)) {
        for (const x of it.subs) {
          if (x && Object.prototype.hasOwnProperty.call(sub, x.stat) && isNum(x.value)) sub[x.stat] += x.value;
        }
      }
    }
    const mb = (id) => num(data.masteryBonus(id, s.mastery[id]), 0);
    let skillLevels = 0;
    for (const id of s.skills.equipped) if (id && s.skills.owned[id]) skillLevels += s.skills.owned[id];
    let allyLevels = 0;
    for (const id of s.allies.equipped) if (id && s.allies.owned[id]) allyLevels += s.allies.owned[id];

    const raw = {
      atk: Math.max(1, Math.round((base.atk + atkGear) * (1 + mb('might')))),
      hp: Math.max(1, Math.round((base.hp + hpGear) * (1 + mb('vitality')))),
      atkSpeed: Math.min(C.atkSpeed, H.atkSpeed * (1 + sub.atkSpeed)),
      critChance: Math.min(C.critChance, H.critChance + sub.critChance),
      critDmg: H.critDmg + sub.critDmg + mb('precision'),
      combo: Math.min(C.combo, sub.combo),
      counter: Math.min(C.counter, sub.counter),
      dodge: Math.min(C.dodge, sub.dodge),
      stun: Math.min(C.stun, sub.stun),
      lifesteal: Math.min(C.lifesteal, sub.lifesteal),
      regen: Math.min(C.regen, sub.regen),
      skillDmg: sub.skillDmg,
      bossDmg: sub.bossDmg,
      goldBonus: sub.goldBonus + mb('greed'),
      chestChance: Math.min(H.chestChanceCap, H.chestChance + mb('fortune')),
      skillLevels,
      allyLevels,
    };
    const fallback = { atk: 1, hp: 1, atkSpeed: H.atkSpeed, critChance: H.critChance, critDmg: H.critDmg, chestChance: H.chestChance };
    for (const k of Object.keys(raw)) {
      if (!isNum(raw[k])) raw[k] = num(fallback[k], 0);
    }
    return raw;
  }

  function getHeroStats() {
    if (!statsCache) statsCache = computeStats(api.s.equipped);
    return Object.assign({}, statsCache);
  }

  function getPower(stats) {
    return D().calcPower(isObj(stats) ? stats : getHeroStats());
  }

  function xpToNext() {
    return D().xpToNext(api.s.hero.level);
  }

  // ------------------------------------------------------------------ currencies
  function amountOf(n) {
    const v = Number(n);
    return isNum(v) && v > 0 ? v : 0;
  }

  function addGoldRaw(n) {
    const v = Math.floor(amountOf(n));
    if (!v) return 0;
    const s = api.s;
    s.gold += v;
    s.stats.goldEarned += v;
    return v;
  }

  function addXpRaw(n) {
    const v = amountOf(n);
    if (!v) return 0;
    const s = api.s;
    const data = D();
    const from = s.hero.level;
    s.hero.xp += v;
    let guard = 0;
    let need = data.xpToNext(s.hero.level);
    while (s.hero.xp >= need && guard < 10000) {
      s.hero.xp -= need;
      s.hero.level += 1;
      need = data.xpToNext(s.hero.level);
      guard++;
    }
    if (s.hero.level !== from) {
      statsDirty();
      emit('levelup', { level: s.hero.level, from });
    }
    return v;
  }

  function fixKeyTimerOn(s, now) {
    const data = D();
    const regen = data.KEY_REGEN_MS;
    if (s.keys >= data.MAX_KEYS) s.keyRegenAt = 0;
    else if (!(s.keyRegenAt > 0) || s.keyRegenAt > now + regen) s.keyRegenAt = now + regen;
  }

  // Grants keys whose regen time has passed; returns the number gained.
  function regenKeys(now) {
    const s = api.s;
    const data = D();
    const max = data.MAX_KEYS;
    const regen = data.KEY_REGEN_MS;
    fixKeyTimerOn(s, now);
    let gained = 0;
    while (s.keys < max && s.keyRegenAt > 0 && now >= s.keyRegenAt && gained < 1000) {
      s.keys += 1;
      gained += 1;
      s.keyRegenAt += regen;
    }
    fixKeyTimerOn(s, now);
    return gained;
  }

  function addGold(n) {
    const v = addGoldRaw(n);
    if (v) changed();
    return v;
  }
  function addGems(n) {
    const v = Math.floor(amountOf(n));
    if (v) {
      api.s.gems += v;
      changed();
    }
    return v;
  }
  function addChests(n) {
    const v = Math.floor(amountOf(n));
    if (v) {
      api.s.chests += v;
      changed();
    }
    return v;
  }
  function addPremiumChests(n) {
    const v = Math.floor(amountOf(n));
    if (v) {
      api.s.premiumChests += v;
      changed();
    }
    return v;
  }
  function addScrolls(n) {
    const v = Math.floor(amountOf(n));
    if (v) {
      api.s.scrolls += v;
      changed();
    }
    return v;
  }
  function addKeys(n) {
    const v = Math.floor(amountOf(n));
    if (v) {
      api.s.keys += v;
      fixKeyTimerOn(api.s, Date.now());
      changed();
    }
    return v;
  }
  function addXp(n) {
    const v = addXpRaw(n);
    if (v) changed();
    return v;
  }

  function canAfford(currency, n) {
    if (CURRENCIES.indexOf(currency) < 0) return false;
    const v = Number(n);
    if (!isNum(v)) return false;
    return api.s[currency] >= Math.max(0, v);
  }

  // Deducts without emitting; toasts on failure.
  function pay(currency, n) {
    if (CURRENCIES.indexOf(currency) < 0) return false;
    const v = Number(n);
    if (!isNum(v) || v < 0) return false;
    const s = api.s;
    if (s[currency] < v) {
      toast('Not enough ' + CURRENCY_NAMES[currency], 'bad');
      return false;
    }
    s[currency] -= v;
    if (currency === 'keys') fixKeyTimerOn(s, Date.now());
    return true;
  }

  function spend(currency, n) {
    if (!pay(currency, n)) return false;
    changed();
    return true;
  }

  function useKey() {
    if (api.s.keys < 1) {
      toast('No keys left. A new key arrives every 30 minutes.', 'bad');
      return false;
    }
    return spend('keys', 1);
  }

  function keyRegenRemaining(nowMs) {
    const s = api.s;
    const now = isNum(nowMs) ? nowMs : Date.now();
    if (s.keys >= D().MAX_KEYS || !(s.keyRegenAt > 0)) return 0;
    return Math.max(0, (s.keyRegenAt - now) / 1000);
  }

  function applyReward(r) {
    if (!isObj(r)) return;
    const s = api.s;
    if (r.gold) addGoldRaw(r.gold);
    if (r.gems) s.gems += Math.floor(amountOf(r.gems));
    if (r.chests) s.chests += Math.floor(amountOf(r.chests));
    if (r.premiumChests) s.premiumChests += Math.floor(amountOf(r.premiumChests));
    if (r.scrolls) s.scrolls += Math.floor(amountOf(r.scrolls));
    if (r.keys) {
      s.keys += Math.floor(amountOf(r.keys));
      fixKeyTimerOn(s, Date.now());
    }
    if (r.xp) addXpRaw(r.xp);
  }

  // ------------------------------------------------------------------ income estimate
  function estimateIncome(floorOverride) {
    const data = D();
    const s = api.s;
    const st = getHeroStats();
    const f = isNum(floorOverride) ? Math.max(1, Math.floor(floorOverride)) : s.campaign.floor;
    let hp = 0;
    let gold = 0;
    let xp = 0;
    let n = 0;
    for (let w = 1; w < data.WAVES_PER_FLOOR; w++) {
      for (const type of data.waveComposition(f, w)) {
        const es = data.enemyStats(f, type, { isBoss: false });
        hp += es.hp;
        gold += es.gold;
        xp += es.xp;
        n++;
      }
    }
    if (!n) {
      const es = data.enemyStats(f, 'skeleton', { isBoss: false });
      hp = es.hp;
      gold = es.gold;
      xp = es.xp;
      n = 1;
    }
    const avgHp = Math.max(1, hp / n);
    const dps = st.atk * (1 + st.critChance * Math.max(0, st.critDmg - 1)) * st.atkSpeed * (1 + st.combo);
    // Waves are not back-to-back kills: each one has a fixed overhead (walk-in, clear beat, run),
    // and skills/allies add damage on top of the auto-attack (see BALANCE.income).
    const I = data.BALANCE.income;
    const perWave = Math.max(1, n / Math.max(1, data.WAVES_PER_FLOOR - 1));
    const kit = kitDps(st, dps, perWave);
    const killTime = (perWave * avgHp) / Math.max(1e-9, kit * num(I.dpsMult, 1));
    const overhead = Math.max(0, num(I.waveOverhead, 0));
    // Survival: each wave costs the hero `threat × incoming DPS × killTime` HP (the enemies in
    // reach while it fights; a fast killer takes little) minus what it heals over the wave. A hero
    // whose HP runs out every `wavesPerLife` waves pays `deathCost` seconds (revive, run, walk-in)
    // per death — extra time per wave. Calibrated against live farming in tests/sim.mjs.
    const surv = heroSurvival(f, st, dps);
    const lost = num(I.threat, 0.2) * surv.incoming * killTime - surv.heal * (killTime + overhead);
    const wavesPerLife = lost > 0 ? st.hp / lost : Infinity;
    const deathOverhead = Number.isFinite(wavesPerLife) ? Math.max(0, num(I.deathCost, 0)) / Math.max(0.05, wavesPerLife) : 0;
    const kps = Math.max(0, Math.min(I.maxKillsPerSec, perWave / (overhead + killTime + deathOverhead)));
    const out = {
      floor: f,
      dps,
      kitDps: kit,
      avgEnemyHp: avgHp,
      incomingDps: surv.incoming, // damage per second of the enemies in reach (before threat)
      healPerSec: surv.heal,
      wavesPerLife: Number.isFinite(wavesPerLife) ? wavesPerLife : 0, // 0 = never dies farming here
      killsPerSec: kps,
      goldPerSec: kps * (gold / n) * (1 + st.goldBonus),
      xpPerSec: kps * (xp / n),
      chestsPerSec: kps * st.chestChance,
    };
    for (const k of Object.keys(out)) if (!isNum(out[k])) out[k] = 0;
    return out;
  }

  // Damage per second of the whole kit while a wave is in reach: auto-attacks (`dps`) plus every
  // equipped skill at its cooldown (area skills hit `BALANCE.income.aoeTargets` enemies) and every
  // equipped ally, so skill/ally upgrades raise AFK income too.
  function kitDps(st, dps, perWave) {
    const data = D();
    const s = api.s;
    const I = data.BALANCE.income;
    const aoe = Math.max(1, Math.min(perWave, num(I.aoeTargets, 2.5)));
    const crit = 1 + clampNum(num(st.critChance, 0), 0, 1) * Math.max(0, num(st.critDmg, 1.5) - 1);
    const hit = st.atk * (1 + Math.max(0, num(st.skillDmg, 0))) * crit;
    let skill = 0;
    const nS = skillSlotsUnlocked();
    for (let i = 0; i < nS; i++) {
      const id = s.skills.equipped[i];
      const L = id ? s.skills.owned[id] : 0;
      if (!L) continue;
      const p = data.skillParams(id, L);
      const cd = Math.max(1, num(p.cd, 10));
      if (id === 'blades') skill += (hit * num(p.dmg, 0) * (num(p.duration, 0) / Math.max(0.1, num(p.tick, 0.5))) * aoe) / cd;
      else if (id === 'warcry') skill += (dps * (num(p.buffAtk, 0) + num(p.buffSpd, 0)) * num(p.duration, 0)) / cd;
      else if (id === 'lightning') skill += (hit * num(p.dmg, 0) * Math.min(num(p.targets, 3), perWave)) / cd;
      else if (num(p.dmg, 0) > 0) skill += (hit * p.dmg * aoe) / cd; // bomb, frost, meteor
    }
    let ally = 0;
    const nA = allySlotsUnlocked();
    for (let i = 0; i < nA; i++) {
      const id = s.allies.equipped[i];
      const L = id ? s.allies.owned[id] : 0;
      if (!L) continue;
      const p = data.allyParams(id, L);
      if (!(num(p.dmg, 0) > 0)) continue;
      ally += (st.atk * p.dmg * (num(p.radius, 0) > 0 ? aoe : 1)) / Math.max(0.15, num(p.interval, 1));
    }
    return dps + skill * num(I.skillUptime, 1) + ally;
  }

  // What hits the hero while it farms waves 1–4 of floor f — the front enemy of each melee lane
  // plus every ranged enemy, less dodge — and what heals it per second: regen, lifesteal, the
  // Pixie and Healing Light.
  function heroSurvival(f, st, dps) {
    const data = D();
    const s = api.s;
    let incoming = 0;
    let waves = 0;
    for (let w = 1; w < data.WAVES_PER_FLOOR; w++) {
      const lanes = {};
      let ranged = 0;
      for (const type of data.waveComposition(f, w)) {
        const def = data.ENEMIES[type] || {};
        const es = data.enemyStats(f, type, { isBoss: false });
        const hit = es.atk * es.atkSpeed;
        if (def.ranged) ranged += hit;
        else {
          const lane = def.flying ? 'air' : 'ground';
          lanes[lane] = Math.max(lanes[lane] || 0, hit);
        }
      }
      incoming += ranged + (lanes.air || 0) + (lanes.ground || 0);
      waves++;
    }
    incoming = (incoming / Math.max(1, waves)) * (1 - clampNum(num(st.dodge, 0), 0, 1));
    let heal = st.hp * num(st.regen, 0) + dps * num(st.lifesteal, 0);
    const fairyLv = s.allies.equipped.indexOf('fairy') >= 0 && s.allies.equipped.indexOf('fairy') < allySlotsUnlocked() ? s.allies.owned.fairy || 0 : 0;
    if (fairyLv) {
      const p = data.allyParams('fairy', fairyLv);
      heal += (st.hp * num(p.heal, 0)) / Math.max(0.1, num(p.interval, 2));
    }
    const healLv = s.skills.equipped.indexOf('heal') >= 0 && s.skills.equipped.indexOf('heal') < skillSlotsUnlocked() ? s.skills.owned.heal || 0 : 0;
    if (healLv) {
      const p = data.skillParams('heal', healLv);
      heal += (st.hp * num(p.heal, 0)) / Math.max(1, num(p.cd, 14));
    }
    return { incoming, heal };
  }

  function offlineCapSeconds() {
    const data = D();
    const hours = data.BALANCE.income.offlineBaseHours + num(data.masteryBonus('patience', api.s.mastery.patience), 0);
    return Math.max(0, hours * 3600);
  }

  function collectOffline(nowMs) {
    const s = api.s;
    const data = D();
    const now = isNum(nowMs) ? nowMs : Date.now();
    const last = isNum(s.lastSeen) && s.lastSeen > 0 ? s.lastSeen : now;
    const seconds = (now - last) / 1000;
    if (!isNum(seconds) || seconds < data.BALANCE.income.offlineMinSeconds) return null;
    const capped = Math.min(seconds, offlineCapSeconds());
    const inc = estimateIncome();
    const eff = data.BALANCE.income.offlineEfficiency;
    const chestEff = num(data.BALANCE.income.offlineChestEfficiency, eff);
    const gold = Math.max(0, Math.floor(inc.goldPerSec * capped * eff));
    const chests = Math.max(0, Math.floor(inc.chestsPerSec * capped * chestEff));
    const xp = Math.max(0, Math.floor(inc.xpPerSec * capped * num(data.BALANCE.income.offlineXpEfficiency, eff)));
    const keys = regenKeys(now);
    addGoldRaw(gold);
    s.chests += chests;
    addXpRaw(xp);
    s.lastSeen = now;
    changed();
    persist();
    return { seconds: Math.floor(seconds), cappedSeconds: Math.floor(capped), gold, chests, xp, keys };
  }

  // ------------------------------------------------------------------ battle callbacks
  function grantKill(info) {
    const s = api.s;
    const data = D();
    const i = isObj(info) ? info : {};
    const isBoss = !!i.isBoss;
    const floor = isNum(i.floor) ? i.floor : s.campaign.floor;
    let baseGold = isNum(i.gold) && i.gold >= 0 ? i.gold : null;
    let baseXp = isNum(i.xp) && i.xp >= 0 ? i.xp : null;
    if (baseGold === null || baseXp === null) {
      const es = data.enemyStats(floor, i.typeId, { isBoss });
      if (baseGold === null) baseGold = es.gold;
      if (baseXp === null) baseXp = es.xp;
    }
    const st = getHeroStats();
    const gold = Math.max(0, Math.round(baseGold * (1 + st.goldBonus)));
    const xp = Math.max(0, Math.round(baseXp));
    const chest = isBoss || Math.random() < st.chestChance;
    s.stats.kills += 1;
    if (isBoss) s.stats.bossKills += 1;
    addGoldRaw(gold);
    if (chest) s.chests += 1;
    addXpRaw(xp);
    changed();
    return { gold, xp, chest };
  }

  function announceUnlocks(prev, next) {
    const data = D();
    const crossed = (f) => prev < f && next >= f;
    data.SKILL_SLOT_FLOORS.forEach((f, i) => {
      if (i > 0 && crossed(f)) {
        toast('Skill slot ' + (i + 1) + ' unlocked!', 'good');
        autoFillSkillSlots();
      }
    });
    data.ALLY_SLOT_FLOORS.forEach((f, i) => {
      if (crossed(f)) {
        toast('Ally slot ' + (i + 1) + ' unlocked!', 'good');
        autoFillAllySlots();
      }
    });
    for (const id of data.DUNGEON_IDS) {
      if (crossed(data.DUNGEONS[id].unlockFloor)) toast(data.DUNGEONS[id].name + ' unlocked!', 'good');
    }
  }

  function onFloorCleared(floor) {
    const s = api.s;
    const data = D();
    const c = s.campaign;
    const f = clampNum(isNum(floor) ? Math.floor(floor) : c.floor, 1, data.BALANCE.enemy.maxFloor - 1);
    const base = data.floorClearRewards(f);
    const st = getHeroStats();
    const gold = Math.max(0, Math.round(base.gold * (1 + st.goldBonus)));
    s.chests += base.chests;
    addGoldRaw(gold);
    s.gems += base.gems;
    const prevHigh = c.highestFloor;
    c.floor = f + 1;
    c.wave = 1;
    c.farming = false;
    c.highestFloor = Math.max(prevHigh, c.floor);
    if (c.highestFloor > prevHigh) announceUnlocks(prevHigh, c.highestFloor);
    changed();
    save();
    return { chests: base.chests, gold, gems: base.gems };
  }

  function setWave(n) {
    const c = api.s.campaign;
    const w = clampNum(toInt(Number(n), 1), 1, D().WAVES_PER_FLOOR);
    if (c.wave !== w) {
      c.wave = w;
      changed();
    }
  }

  function setFarming(on) {
    const c = api.s.campaign;
    const v = !!on;
    if (c.farming !== v) {
      c.farming = v;
      changed();
    }
  }

  function onHeroDied() {
    api.s.stats.deaths += 1;
    changed();
  }

  function grantFlyingChest() {
    const s = api.s;
    const data = D();
    const table = data.BALANCE.flyingChest;
    const e = table[DD.weightedIndex(table.map((x) => x.weight))] || table[0];
    const rnd = () => DD.randInt(Math.floor(num(e.min, 1)), Math.floor(num(e.max, num(e.min, 1))));
    let amount = 0;
    let label = '';
    switch (e.type) {
      case 'gems':
        amount = rnd();
        s.gems += amount;
        label = '+' + amount + ' Gems';
        break;
      case 'chests':
        amount = rnd();
        s.chests += amount;
        label = '+' + amount + ' Chests';
        break;
      case 'gold': {
        const st = getHeroStats();
        const inc = estimateIncome();
        const floorMin = data.killGold(s.campaign.floor) * num(e.minKills, 10) * (1 + st.goldBonus);
        amount = Math.max(1, Math.round(Math.max(inc.goldPerSec * num(e.seconds, 60), floorMin)));
        addGoldRaw(amount);
        label = '+' + DD.fmt(amount) + ' Gold';
        break;
      }
      case 'scrolls':
        amount = rnd();
        s.scrolls += amount;
        label = '+' + amount + ' Skill Scrolls';
        break;
      case 'key':
      default:
        amount = Math.max(1, rnd());
        s.keys += amount;
        fixKeyTimerOn(s, Date.now());
        label = amount === 1 ? '+1 Key' : '+' + amount + ' Keys';
        break;
    }
    s.stats.flyingChests += 1;
    changed();
    return { type: e.type === 'key' ? 'key' : e.type, amount, label };
  }

  function dungeonUnlocked(id) {
    const d = D().DUNGEONS[id];
    return !!d && api.s.campaign.highestFloor >= d.unlockFloor;
  }

  function dungeonLevel(id) {
    const d = api.s.dungeons[id];
    return d ? d.level : 1;
  }

  function grantDungeonWin(id) {
    const s = api.s;
    const data = D();
    if (!data.DUNGEONS[id] || !s.dungeons[id]) return {};
    const lvl = s.dungeons[id].level;
    const r = data.dungeonRewards(id, lvl);
    const out = {};
    if (r.gold) {
      const st = getHeroStats();
      out.gold = Math.max(1, Math.round(r.gold * (1 + st.goldBonus)));
      addGoldRaw(out.gold);
    }
    if (r.gems) {
      out.gems = Math.floor(r.gems);
      s.gems += out.gems;
    }
    if (r.scrolls) {
      out.scrolls = Math.floor(r.scrolls);
      s.scrolls += out.scrolls;
    }
    if (r.premiumChests) {
      out.premiumChests = Math.floor(r.premiumChests);
      s.premiumChests += out.premiumChests;
    }
    s.dungeons[id].level = lvl + 1;
    s.stats.dungeonsWon += 1;
    changed();
    save();
    return out;
  }

  // ------------------------------------------------------------------ chests & gear
  function sellGold(item) {
    const st = getHeroStats();
    return Math.max(1, Math.round(D().itemSellValue(item) * (1 + st.goldBonus)));
  }

  function itemSellValue(item) {
    if (!isObj(item)) return 0;
    return sellGold(item);
  }

  function emptyCompare() {
    const p = getPower();
    return { current: null, powerBefore: p, powerAfter: p, delta: 0, lines: [] };
  }

  function compareItem(item) {
    const data = D();
    const s = api.s;
    if (!isObj(item) || !data.SLOT_INFO[item.slot] || !isObj(item.main)) return emptyCompare();
    const current = s.equipped[item.slot] || null;
    const before = getHeroStats();
    const eq = Object.assign({}, s.equipped);
    eq[item.slot] = item;
    const after = computeStats(eq);
    const powerBefore = data.calcPower(before);
    const powerAfter = data.calcPower(after);
    const lines = [];
    const mainStat = data.SLOT_INFO[item.slot].stat;
    const mb = current && isObj(current.main) ? num(current.main.value, 0) : 0;
    const ma = num(item.main.value, 0);
    lines.push({ stat: mainStat, label: data.STAT_INFO[mainStat].label, before: mb, after: ma, diff: ma - mb, fmt: 'num' });
    const subVal = (it, k) => {
      if (!it || !Array.isArray(it.subs)) return 0;
      let v = 0;
      for (const x of it.subs) if (x && x.stat === k && isNum(x.value)) v += x.value;
      return v;
    };
    for (const k of data.SUBSTATS) {
      const b = subVal(current, k);
      const a = subVal(item, k);
      if (!a && !b) continue;
      lines.push({ stat: k, label: data.STAT_INFO[k].label, before: b, after: a, diff: a - b, fmt: 'pct' });
    }
    return { current, powerBefore, powerAfter, delta: powerAfter - powerBefore, lines };
  }

  function comparePending() {
    const p = api.s.pendingItem;
    return p ? compareItem(p) : null;
  }

  function isUpgrade(item) {
    return compareItem(item).delta > 0;
  }

  // Equip an item into its slot; the previously worn item is sold. No 'state:changed'.
  function doEquip(item) {
    const s = api.s;
    const old = s.equipped[item.slot] || null;
    s.equipped[item.slot] = item;
    s.stats.itemsEquipped += 1;
    let gold = 0;
    if (old) {
      gold = sellGold(old);
      addGoldRaw(gold);
      s.stats.itemsSold += 1;
    }
    statsDirty();
    emit('item:equipped', { item, old });
    if (old) emit('item:sold', { item: old, gold });
    return gold;
  }

  function doSell(item) {
    const s = api.s;
    const gold = sellGold(item);
    addGoldRaw(gold);
    s.stats.itemsSold += 1;
    emit('item:sold', { item, gold });
    return gold;
  }

  function rarityLabel(item) {
    const r = D().RARITIES[item.rarity];
    return (r ? r.name + ' ' : '') + item.name;
  }

  function openChest(opts) {
    const s = api.s;
    const data = D();
    const premium = !!(isObj(opts) && opts.premium);
    if (s.pendingItem) return null;
    if (premium ? s.premiumChests < 1 : s.chests < 1) return null;
    if (premium) s.premiumChests -= 1;
    else s.chests -= 1;
    const hf = s.campaign.highestFloor;
    const ilvl = premium ? data.premiumIlvl(hf) : data.itemIlvl(hf);
    const item = data.rollItem({ ilvl, chestLevel: s.chestLevel, premium });
    s.stats.chestsOpened += 1;
    if (item.rarity > s.stats.bestItemRarity) s.stats.bestItemRarity = item.rarity;

    let decision = 'pending';
    if (s.autoOpen) {
      const al = s.settings.autoLoot;
      const upgrade = compareItem(item).delta > 0;
      if (upgrade) {
        decision = al.autoEquip ? 'equipped' : 'pending'; // auto-open pauses until it is resolved
      } else if (al.sell[item.rarity]) {
        decision = 'sold';
      } else if (item.rarity >= al.stopRarity) {
        decision = 'pending';
        s.autoOpen = false;
        toast('Auto-open stopped: ' + rarityLabel(item) + '!', item.rarity >= 4 ? 'rare' : 'info');
      } else {
        decision = 'pending';
        s.autoOpen = false;
        toast('Auto-open paused: decide on ' + rarityLabel(item), 'info');
      }
    }

    if (decision === 'equipped') {
      doEquip(item);
      if (item.rarity >= 4) toast(rarityLabel(item) + ' equipped!', 'rare');
    } else if (decision === 'sold') {
      const g = doSell(item);
      if (item.rarity >= 4) toast('Auto-sold ' + rarityLabel(item) + ' for ' + DD.fmt(g) + ' gold', 'info');
    } else {
      s.pendingItem = item;
    }
    emit('chest:opened', { item, decision, premium });
    changed();
    return { item, decision };
  }

  function equipPending() {
    const s = api.s;
    const item = s.pendingItem;
    if (!item) return false;
    s.pendingItem = null;
    doEquip(item);
    changed();
    return true;
  }

  function sellPending() {
    const s = api.s;
    const item = s.pendingItem;
    if (!item) return false;
    s.pendingItem = null;
    doSell(item);
    changed();
    return true;
  }

  function chestUpgradeCost() {
    const s = api.s;
    const data = D();
    if (s.chestLevel >= data.MAX_CHEST_LEVEL) return Infinity;
    return data.chestUpgradeCost(s.chestLevel);
  }

  function upgradeChestLevel() {
    const s = api.s;
    const data = D();
    if (s.chestLevel >= data.MAX_CHEST_LEVEL) {
      toast('The chest is already at max level', 'info');
      return false;
    }
    if (!pay('gold', data.chestUpgradeCost(s.chestLevel))) return false;
    s.chestLevel += 1;
    const L = s.chestLevel;
    emit('purchase', { kind: 'chest', id: 'chest', level: L });
    const unlockNames = { 6: 'Legendary', 11: 'Mythic', 16: 'Celestial' };
    if (unlockNames[L]) toast('Chest level ' + L + '! ' + unlockNames[L] + ' loot can now drop!', 'rare');
    else toast('Chest level ' + L + '!', 'good');
    changed();
    return true;
  }

  function rarityOdds(level) {
    return D().rarityOdds(isNum(level) ? level : api.s.chestLevel);
  }

  function premiumOdds(level) {
    return D().premiumOdds(isNum(level) ? level : api.s.chestLevel);
  }

  function setAutoOpen(on) {
    const s = api.s;
    const v = !!on;
    if (v && s.chests < 1) {
      toast('No chests to open', 'bad');
      if (s.autoOpen) {
        s.autoOpen = false;
        changed();
      }
      return false;
    }
    if (s.autoOpen === v) return true;
    s.autoOpen = v;
    if (v) {
      s.stats.autoOpenUsed += 1;
      autoOpenTimer = D().BALANCE.timers.autoOpenInterval; // first chest opens on the next tick
    }
    changed();
    return true;
  }

  // ------------------------------------------------------------------ skills
  function skillSlotsUnlocked() {
    return slotsFor(D().SKILL_SLOT_FLOORS, api.s.campaign.highestFloor, 1);
  }

  function skillCost(id) {
    const data = D();
    const def = data.SKILLS[id];
    if (!def) return {};
    const L = api.s.skills.owned[id];
    if (!L) return { unlock: def.unlock };
    if (L >= data.MAX_SKILL_LEVEL) return {};
    return { upgrade: data.skillUpgradeCost(L) };
  }

  function autoFillSkillSlots() {
    const s = api.s;
    const n = skillSlotsUnlocked();
    let filled = false;
    for (const id of D().SKILL_IDS) {
      if (!s.skills.owned[id] || s.skills.equipped.indexOf(id) >= 0) continue;
      const free = s.skills.equipped.findIndex((x, i) => i < n && !x);
      if (free < 0) break;
      s.skills.equipped[free] = id;
      filled = true;
    }
    if (filled) statsDirty();
  }

  function unlockSkill(id) {
    const s = api.s;
    const data = D();
    const def = data.SKILLS[id];
    if (!def) return false;
    if (s.skills.owned[id]) {
      toast(def.name + ' is already unlocked', 'info');
      return false;
    }
    if (!pay('scrolls', def.unlock)) return false;
    s.skills.owned[id] = 1;
    const n = skillSlotsUnlocked();
    const free = s.skills.equipped.findIndex((x, i) => i < n && !x);
    if (free >= 0) s.skills.equipped[free] = id;
    statsDirty();
    emit('purchase', { kind: 'skill', id, action: 'unlock', level: 1 });
    toast(def.name + ' unlocked!', 'good');
    changed();
    return true;
  }

  function upgradeSkill(id) {
    const s = api.s;
    const data = D();
    const def = data.SKILLS[id];
    if (!def) return false;
    const L = s.skills.owned[id];
    if (!L) {
      toast('Unlock ' + def.name + ' first', 'bad');
      return false;
    }
    if (L >= data.MAX_SKILL_LEVEL) {
      toast(def.name + ' is at max level', 'info');
      return false;
    }
    if (!pay('scrolls', data.skillUpgradeCost(L))) return false;
    s.skills.owned[id] = L + 1;
    statsDirty();
    emit('purchase', { kind: 'skill', id, action: 'upgrade', level: L + 1 });
    changed();
    return true;
  }

  function equipSkill(id, slot) {
    const s = api.s;
    const data = D();
    const def = data.SKILLS[id];
    if (!def) return false;
    if (!s.skills.owned[id]) {
      toast('Unlock ' + def.name + ' first', 'bad');
      return false;
    }
    const i = toInt(Number(slot), -1);
    if (i < 0 || i >= 4) return false;
    if (i >= skillSlotsUnlocked()) {
      toast('Skill slot ' + (i + 1) + ' unlocks at floor ' + data.SKILL_SLOT_FLOORS[i], 'bad');
      return false;
    }
    const eq = s.skills.equipped;
    const cur = eq.indexOf(id);
    if (cur === i) return true;
    if (cur >= 0) eq[cur] = eq[i];
    eq[i] = id;
    statsDirty();
    changed();
    return true;
  }

  function unequipSkill(slot) {
    const eq = api.s.skills.equipped;
    const i = toInt(Number(slot), -1);
    if (i < 0 || i >= eq.length || !eq[i]) return false;
    eq[i] = null;
    statsDirty();
    changed();
    return true;
  }

  // ------------------------------------------------------------------ allies
  function allySlotsUnlocked() {
    return slotsFor(D().ALLY_SLOT_FLOORS, api.s.campaign.highestFloor, 0);
  }

  function allyUpgradeCost(id) {
    const data = D();
    if (!data.ALLIES[id]) return Infinity;
    const L = api.s.allies.owned[id] || 1;
    if (L >= data.MAX_ALLY_LEVEL) return Infinity;
    return data.allyUpgradeCost(L);
  }

  function allyCost(id) {
    const data = D();
    const def = data.ALLIES[id];
    if (!def) return {};
    const L = api.s.allies.owned[id];
    if (!L) return { unlock: def.unlock };
    if (L >= data.MAX_ALLY_LEVEL) return {};

  }

  function autoFillAllySlots() {
    const s = api.s;
    const n = allySlotsUnlocked();

      P.ang = r[5] > 0 ? 58 : 48;
      P.cape = 2 + (p.i % 2);
      P.tails = 1 + (p.i % 2);
    } else if (p.anim === 'attack') {
      if (p.i === 0) {
        P.lean = -1;
        P.legs = [-2, 2, 0, 0];
        P.hand = [cx - 7, 18];
        P.ang = -62;
        P.behind = true;
        P.barm = 2;
        P.cape = 1;
      } else if (p.i === 1) {
        P.lean = 1;
        P.legs = [-3, 3, 0, 0];
        P.hand = [cx + 7, 21];
        P.ang = 95;
        P.barm = -2;
        P.cape = 2;
        P.tails = 1;
      } else {
        P.lean = 1;
        P.legs = [-3, 3, 0, 0];
        P.hand = [cx + 7, 24];
        P.ang = 128;
        P.barm = -2;
        P.cape = 3;
        P.tails = 2;
      }

      P.lean = -2;
      P.legs = [-2, 1, 0, 0];

      P.ang = 70;
      P.eyes = 'shut';

    return P;
  }

  function heroLeg(g, hx, dx, lift, back) {
    const top = 25;
    const bottom = 30 - lift;
    for (let y = top; y <= bottom; y++) {
      const t = (y - top) / Math.max(1, bottom - top);
      const x = Math.round(hx + dx * t);
      const boot = y >= bottom - 2;
      const rp = boot ? HP.boot : HP.pants;
      g.set(x, y, back ? rp[0] : rp[boot && y === bottom - 2 ? 2 : 1]);
      g.set(x + 1, y, back ? rp[0] : rp[0]);
      if (y === bottom) {
        g.set(x + 2, y, back ? rp[0] : rp[1]);
        if (lift) g.set(x - 1, y, back ? rp[0] : rp[1]);
      }
    }
  }

  function drawHero(g, p, noWeapon) {
    const L = p.look || HERO_DEFAULT_LOOK;
    const trim = trimRamp(L.armorRarity);
    const P = heroPose(p);
    const cx = P.cx;
    const ux = cx + P.lean; // upper-body x
    const ty = 20 + P.b; // torso top
    const hy = 11 + P.b; // head top

    // cape (behind everything)
    const capePts = [
      [[ux - 3, ty], [ux + 1, ty], [ux - 1, ty + 7], [ux - 6, ty + 9], [ux - 6, ty + 3]],
      [[ux - 3, ty], [ux + 1, ty], [ux - 1, ty + 7], [ux - 7, ty + 8], [ux - 6, ty + 3]],
      [[ux - 3, ty], [ux + 1, ty], [ux - 3, ty + 5], [ux - 11, ty + 6], [ux - 9, ty + 1]],
      [[ux - 3, ty], [ux + 1, ty], [ux - 3, ty + 6], [ux - 11, ty + 4], [ux - 9, ty]],
    ][P.cape];
    S(g, HP.cape, (m, c) => poly(m, capePts, c), { top: 1, bot: 1 });
    // cape fold
    g.set(ux - 4, ty + 3, HP.cape[0]);
    g.set(ux - 5, ty + 4, HP.cape[0]);

    // headband tails fluttering behind the head
    if (P.tails) {
      g.set(ux - 5, hy + 3, trim[1]);
      g.set(ux - 6, hy + 3 + (P.tails === 1 ? 1 : 0), trim[0]);
      g.set(ux - 7, hy + 3 + (P.tails === 1 ? 1 : -1), trim[0]);
    }

    // back leg + back arm
    heroLeg(g, cx - 3, P.legs[0], P.legs[2], true);
    const bax = ux - 4 + P.barm;
    line(g, ux - 3, ty + 1, bax, ty + 4, HP.steel[0]);
    line(g, ux - 2, ty + 1, bax + 1, ty + 4, HP.steel[0]);
    g.set(bax, ty + 5, HP.skin[0]);
    g.set(bax + 1, ty + 5, HP.skin[0]);

    // front leg
    heroLeg(g, cx, P.legs[1], P.legs[3], false);

    // weapon behind the head during the wind-up
    const W = WEAPONS[L.weaponEra] || WEAPONS[0];
    const wg = weaponGrid(L.weaponEra, L.weaponRarity);
    const frontArm = () => {
      const [hx, hyy] = P.hand;
      line(g, ux + 1, ty + 1, hx - 1, hyy, HP.steel[1], 1);
      line(g, ux + 2, ty + 1, hx, hyy - 1, HP.steel[1], 1);
      rect(g, hx - 1, hyy - 1, 2, 2, HP.skin[1]);
      g.set(hx - 1, hyy - 1, HP.skin[2]);
    };
    if (!noWeapon && P.behind) place(g, wg, P.ang, W.gx, W.gy, P.hand[0], P.hand[1]);
    if (P.behind) frontArm();

    // torso: breastplate, belt, tassets
    S(g, HP.steel, (m, c) => {
      rect(m, ux - 4, ty, 8, 3, c);
      rect(m, ux - 3, ty + 3, 7, 1, c);
    }, { top: 1, bot: 1, right: 1 });
    g.set(ux + 1, ty + 1, HP.steel[2]);
    g.set(ux + 2, ty + 1, HP.steel[2]);
    hline(g, ux - 4, ux + 3, ty + 3, HP.leather[1]);
    g.set(ux - 4, ty + 3, HP.leather[0]);
    g.set(ux + 1, ty + 3, trim[2]);
    g.set(ux + 2, ty + 3, trim[1]);
    for (let i = 0; i < 7; i++) g.set(ux - 4 + i, ty + 4, i % 2 ? trim[0] : trim[1]);
    // collar + pauldron (armour trim)
    hline(g, ux - 2, ux + 1, ty, trim[1]);
    S(g, trim, (m, c) => oval(m, ux - 1, ty - 1, 5, 3, c), { top: 1, bot: 1 });

    // head
    stamp(g, ux - 4, hy, P.eyes === 'shut' ? HEAD_HURT : HEAD_ROWS, headPal(trim));

    // weapon in front + front arm
    if (!noWeapon && !P.behind) place(g, wg, P.ang, W.gx, W.gy, P.hand[0], P.hand[1]);
    if (!P.behind) frontArm();
  }

  function postHero(g, p) {
    const L = p.look || HERO_DEFAULT_LOOK;
    if (p.anim === 'dead') return;
    const P = heroPose(p);
    const rar = L.weaponRarity;
    const rc = C(rar >= 0 ? rarityColor(rar) : '#ffffff');
    // swing smear: a crisp crescent that is thickest mid-swing
    if (p.anim === 'attack' && p.i > 0) {
      const sx = P.cx + 2;
      const sy = 22;
      const a0 = p.i === 1 ? -60 : 70;
      const a1 = p.i === 1 ? 96 : 135;
      const outer = 14;
      const edgeC = rar >= 1 ? mix('#ffffff', rc, 0.75) : C('#9fd8ff');
      for (let a = a0; a <= a1; a += 1.5) {
        const k = (a - a0) / (a1 - a0);
        const thick = p.i === 1 ? 1 + Math.round(3.4 * Math.sin(Math.PI * Math.min(1, k * 1.15))) : Math.max(0, Math.round(2.5 * (1 - k)));
        for (let r = outer - thick; r <= outer; r++) {
          const [dx, dy] = rotPoint(0, -r, a);
          const x = Math.round(sx + dx);
          const y = Math.round(sy + dy);
          if (g.solid(x, y) && !(ca(g.get(x, y)) === 255 && g.get(x, y) === C(OUT))) continue;
          const isEdge = r === outer;
          const fade = p.i === 1 ? (k < 0.15 ? 0.55 : 1) : 0.75;
          g.set(x, y, alpha(isEdge ? edgeC : C('#ffffff'), fade * (isEdge ? 0.95 : 0.9)));
        }
      }
    }
    // rarity glint on the weapon tip
    if (rar >= 1) {
      const W = WEAPONS[L.weaponEra] || WEAPONS[0];
      const [dx, dy] = rotPoint(W.tx - W.gx, W.ty - W.gy, P.ang);
      const x = Math.round(P.hand[0] + dx);
      const y = Math.round(P.hand[1] + dy);
      const tw = p.anim === 'idle' || p.anim === 'run' ? p.i % 2 === 0 : true;
      if (rar === 1) {
        g.set(x, y, rc);
      } else if (tw) {
        sparkle(g, x, y, rc, rar >= 4);
      } else {
        g.set(x, y, '#ffffff');
      }
    }
  }

  function heroDead(g, look) {

  const HERO_DEFAULT_LOOK = { weaponEra: 0, weaponRarity: -1, armorRarity: -1 };
  function heroLookNorm(look) {
    const l = look && typeof look === 'object' ? look : {};
    const n = (v, lo, hi, dflt) => {
      const x = Math.floor(Number(v));
      return Number.isFinite(x) ? Math.max(lo, Math.min(hi, x)) : dflt;
    };
    // hasWeapon / hasArmor === false (nothing equipped) → no glint / default bronze trim
    return {
      weaponEra: n(l.weaponEra, 0, 5, 0),
      weaponRarity: l.hasWeapon === false || l.weaponRarity === null || l.weaponRarity === undefined ? -1 : n(l.weaponRarity, -1, 6, -1),
      armorRarity: l.hasArmor === false || l.armorRarity === null || l.armorRarity === undefined ? -1 : n(l.armorRarity, -1, 6, -1),
    };
  }
  function heroLookKey(look) {
    const l = heroLookNorm(look);
    return l.weaponEra + '|' + l.weaponRarity + '|' + l.armorRarity;
  }

  def('hero', {

  ];
  // [backFootDx, frontFootDx, backLift, frontLift]
  function gait(p, amp) {
    const a = amp || 1;
    if (p.anim === 'walk') {
      const s = STRIDE[p.ph % 4];
      return [s[0] * a, s[1] * a, s[2], s[3]];
    }
    if (p.anim === 'attack') return p.atk ? [-a - 1, a + 1, 0, 0] : [-a, a, 0, 0];
    return [-1, 1, 0, 0];
  }
  // upper-body forward shift: wind-up leans back, strike lunges forward
  function lean(p, back, fwd) {
    if (p.anim === 'attack') return p.atk === 0 ? -back : fwd;

    return 0;
  }
  const FIRE = R3('#c8300c', '#ff8a1a', '#ffd84a').concat([C('#fff8c8')]);
  const GFIRE = R3('#1f8a3a', '#4ad84a', '#b4ff7a').concat([C('#f0ffe0')]);
  const VFIRE = R3('#5a2aa8', '#a86aff', '#e0c8ff').concat([C('#ffffff')]);
  // upward flame whose bottom-left corner is (x, y)
  function flame(g, x, y, w, h, seed, pal) {
    const r = rng(seed * 7919 + 17);
    const P = pal || FIRE;
    for (let i = 0; i < w; i++) {
      const u = w <= 1 ? 0 : Math.abs(i - (w - 1) / 2) / ((w - 1) / 2);
      const colH = Math.max(1, Math.round(h * Math.pow(1 - u * 0.8, 0.85) * (0.68 + 0.32 * r())));
      for (let j = 0; j < colH; j++) {
        const f = j / colH;
        let c;
        if (u < 0.5 && f < 0.42) c = P[3];
        else if (f > 0.72) c = P[0];
        else if (f > 0.4 || u > 0.7) c = P[1];
        else c = P[2];
        g.set(x + i, y - j, c);
      }
    }
  }
  function fireball(g, cx, cy, r, seed, pal) {
    const P = pal || FIRE;
    disc(g, cx, cy, r, P[0]);
    disc(g, cx, cy, Math.max(0.5, r - 1), P[1]);
    disc(g, cx - (r > 2 ? 1 : 0), cy - (r > 2 ? 1 : 0), Math.max(0.4, r - 2), P[2]);
    if (r >= 3) disc(g, cx - 1, cy - 1, r - 3.2, P[3]);
    flame(g, cx - r + 1, cy - r + 1, r * 2 - 1, Math.round(r * 1.2), seed, P);
  }
  function crack(g, pts, c1, c2) {
    for (let i = 0; i + 1 < pts.length; i++) line(g, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], c1);
    if (c2) for (let i = 1; i + 1 < pts.length; i++) g.set(pts[i][0], pts[i][1], c2);
  }
  function eye2(g, x, y, white, pupil, front) {
    g.set(x, y, white);
    g.set(x + 1, y, white);
    g.set(x, y + 1, white);
    g.set(x + 1, y + 1, white);
    g.set(front ? x + 1 : x, y + 1, pupil);
    g.set(front ? x + 1 : x, y, pupil);

  // stick leg from hip to foot with a knee bend; c = colour, w = width
  function limb(g, x0, y0, x1, y1, kneeDx, c, w) {
    const kx = Math.round((x0 + x1) / 2 + (kneeDx || 0));
    const ky = Math.round((y0 + y1) / 2);
    line(g, x0, y0, kx, ky, c, w || 1);
    line(g, kx, ky, x1, y1, c, w || 1);

  // shaded fat leg column (w wide) from hip to foot with a foot block toward the front
  function fatLeg(g, hx, hy, fy, dx, lift, w, rp, footRp, toe) {
    const bottom = fy - lift;
    const m = new Grid(g.w, g.h);
    for (let y = hy; y <= bottom; y++) {

      rect(m, x, y, w, 1, MASK);

    shadeMask(g, m, rp, { top: 0, bot: 0, left: 1, right: 1 });
    if (footRp) {
      const fx = Math.round(hx + dx);
      sRect(g, fx - 1, bottom - 1, w + (toe || 1) + 1, 2, footRp, { top: 1, bot: 1 });
    }
  }
  // ===================================================================== CRYPT — bone / teal / moss

  def('skeleton', {

  const SLIME = [C('#183418'), C('#2c6a2c'), C('#4fa040'), C('#9ee070')];
  function slimeBody(g, cx, ground, w, h, skew, mood) {
    const top = ground - h + 1;
    const m = new Grid(g.w, g.h);
    for (let y = top; y <= ground; y++) {
      const t = (y - top) / Math.max(1, h - 1); // 0 top → 1 bottom
      const half = (w / 2) * Math.sqrt(Math.max(0, 1 - Math.pow(1 - Math.min(1, t * 1.15), 2)));
      const off = Math.round(skew * (1 - t));
      for (let x = Math.round(cx - half + off); x < Math.round(cx + half + off); x++) m.set(x, y, MASK);
    }
    shadeMask(g, m, SLIME, { top: 1, bot: 2, right: 1 });
    // translucent swallowed bone
    const bx = cx - 3 + Math.round(skew / 2);
    const by = ground - Math.round(h * 0.4);
    hline(g, bx, bx + 4, by, mix(BONE[1], SLIME[2], 0.5));
    g.set(bx - 1, by - 1, mix(BONE[1], SLIME[2], 0.5));
    g.set(bx + 5, by + 1, mix(BONE[1], SLIME[2], 0.5));
    // shine
    g.set(cx - Math.round(w / 4) + skew, top + 2, '#e8ffd8');
    g.set(cx - Math.round(w / 4) + 1 + skew, top + 1, '#e8ffd8');
    // eyes near the front
    const ex = cx + Math.round(w / 6) + skew;
    const ey = top + Math.max(2, Math.round(h * 0.3));
    if (mood === 'dead') {
      g.set(ex, ey, SOCKET);
      g.set(ex + 3, ey, SOCKET);
    } else if (mood === 'hurt') {
      hline(g, ex, ex + 1, ey + 1, SOCKET);
      hline(g, ex + 3, ex + 4, ey + 1, SOCKET);
    } else {
      eye2(g, ex, ey, '#f4fff0', SOCKET, true);
      eye2(g, ex + 3, ey, '#f4fff0', SOCKET, true);
      if (mood === 'angry') {
        g.set(ex, ey - 1, SOCKET);
        g.set(ex + 4, ey - 1, SOCKET);
        rect(g, ex + 1, ey + 3, 3, 2, '#14280f');
      }
    }
  }
  def('slime', {
